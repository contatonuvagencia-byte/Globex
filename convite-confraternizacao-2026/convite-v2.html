<title>Convite Confraternização AFTs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* Convite SINAIT DS/MG · versão sofisticada. Mais respiro, filetes finos, foto da fachada em moldura de arco,
   placa do restaurante em medalhão, logo como assinatura no rodapé. Preto #111111, laranja #cc4e00, gelo #F5F5F5. */
:root {
  --gelo: #F5F5F5;
  --gelo-60: rgba(245,245,245,.6);
  --gelo-20: rgba(245,245,245,.2);
  --laranja: #cc4e00;
  --laranja-claro: #e8783a;
  --preto: #111111;
  --f-display: "Anton", Impact, "Arial Narrow", sans-serif;
  --f-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
body { background: #080808; color: var(--gelo); font-family: var(--f-body); padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
.wrap { position: relative; overflow: hidden; }
.wrap.feed { width: min(100%, 420px); aspect-ratio: 1080 / 1350; }
.wrap.story { width: min(100%, 340px); aspect-ratio: 1080 / 1920; }
.slide { position: absolute; left: 0; top: 0; width: 1080px; transform-origin: 0 0; overflow: hidden; color: var(--gelo); box-sizing: border-box;
  background: radial-gradient(80% 45% at 50% 0%, #1d1a18 0%, var(--preto) 60%), var(--preto);
  display: flex; flex-direction: column; align-items: center; text-align: center; }
.feed .slide { height: 1350px; padding: 100px 110px 92px; gap: 28px; }
.story .slide { height: 1920px; padding: 290px 110px 300px; gap: 34px; }
body.export { padding: 0; background: var(--preto); }
body.export .row { display: block; }
body.export .wrap.feed { width: 1080px; height: 1350px; aspect-ratio: auto; }
body.export .wrap.story { width: 1080px; height: 1920px; aspect-ratio: auto; }

/* moldura em filete */
.slide::before { content: ""; position: absolute; inset: 40px; border: 2px solid var(--gelo-20); pointer-events: none; }
.slide::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 900px; height: 360px; margin-left: -450px; pointer-events: none;
  background: radial-gradient(50% 60% at 50% 100%, rgba(204,78,0,.28) 0%, transparent 70%); }
.story .slide::before { inset: 200px 40px 190px; }

.eyebrow { font-weight: 500; font-size: 24px; letter-spacing: .55em; text-transform: uppercase; color: var(--laranja-claro); padding-left: .55em; }

/* arco */
.arco { position: relative; width: 760px; height: 400px; flex: none; }
.arco .contorno { position: absolute; inset: -16px; border: 2px solid var(--laranja); border-radius: 416px 416px 0 0 / 300px 300px 0 0; }
.arco img.fachada { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 28% 78%;
  border-radius: 400px 400px 0 0 / 284px 284px 0 0; filter: saturate(1.05) contrast(1.05); }
.arco .medalhao { position: absolute; right: -78px; bottom: 30px; width: 180px; height: 180px; border-radius: 50%; overflow: hidden;
  border: 6px solid var(--preto); box-shadow: 0 0 0 2px var(--laranja), 0 18px 40px rgba(0,0,0,.5); }
.arco .medalhao img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; }
.story .arco { width: 800px; height: 500px; }
.story .arco .contorno { border-radius: 426px 426px 0 0 / 360px 360px 0 0; }
.story .arco img.fachada { border-radius: 410px 410px 0 0 / 344px 344px 0 0; }
.story .arco .medalhao { width: 210px; height: 210px; right: -70px; bottom: 50px; }

h1 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; margin: 14px 0 0; font-size: 96px; line-height: 1; letter-spacing: .03em; }
.sub { font-weight: 300; font-size: 30px; letter-spacing: .32em; text-transform: uppercase; color: var(--gelo-60); margin-top: -8px; padding-left: .32em; }
.sub b { font-weight: 600; color: var(--gelo); }

.detalhes { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1.6fr; border-top: 2px solid var(--gelo-20); border-bottom: 2px solid var(--gelo-20); }
.detalhes > div { padding: 22px 10px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.detalhes > div + div { border-left: 2px solid var(--gelo-20); }
.rot { font-weight: 500; font-size: 18px; letter-spacing: .4em; text-transform: uppercase; color: var(--laranja-claro); padding-left: .4em; }
.val { font-family: var(--f-display); font-size: 64px; line-height: 1; }
.val.local { font-size: 44px; text-transform: uppercase; letter-spacing: .02em; }
.det { font-size: 21px; font-weight: 400; color: var(--gelo-60); line-height: 1.3; }

.rsvp { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.rsvp p { margin: 0; font-size: 26px; font-weight: 400; line-height: 1.4; color: var(--gelo-60); }
.rsvp p b { color: var(--gelo); font-weight: 600; }
.rsvp .tel { font-weight: 600; font-size: 40px; letter-spacing: .04em; color: var(--gelo); font-variant-numeric: tabular-nums; }
.rsvp .tel span { color: var(--laranja-claro); }

.assinatura { margin-top: auto; display: flex; align-items: center; gap: 26px; }
.assinatura i { width: 90px; height: 2px; background: var(--gelo-20); }
.assinatura img { width: 130px; }
.story .assinatura img { width: 150px; }
.story h1 { font-size: 104px; }
</style>

<div class="row" id="row"></div>

<script>
const conteudo = (formato) => `
  <span class="eyebrow">Convite</span>
  <div class="arco">
    <span class="contorno"></span>
    <img class="fachada" src="fotos/fachada.jpg" alt="Fachada da Parrilla Savassi158 à noite">
    <span class="medalhao"><img src="fotos/placa.jpg" alt="Placa da Parrilla Savassi158"></span>
  </div>
  <h1>Confraternização</h1>
  <span class="sub"><b>AFT's</b> · SINAIT DS/MG</span>
  <div class="detalhes">
    <div><span class="rot">Data</span><span class="val">03.12</span><span class="det">quinta-feira</span></div>
    <div><span class="rot">Horário</span><span class="val">18h</span><span class="det">início</span></div>
    <div><span class="rot">Local</span><span class="val local">Parrilla Savassi158</span><span class="det">Rua Professor Moraes, 158<br>Funcionários, BH</span></div>
  </div>
  <div class="rsvp">
    <p>Confirme sua presença <b>até 27/11</b><br>pelo WhatsApp da DS-MG, com Alzira</p>
    <span class="tel"><span>(31)</span> 99339-0116</span>
  </div>
  <div class="assinatura"><i></i><img src="logo-sinait-dsmg.png" alt="SINAIT DS/MG"><i></i></div>`;
// o story vem primeiro para a exportação capturar a página inteira
document.getElementById('row').innerHTML =
  `<div class="wrap story"><section class="slide" data-out="convite-confraternizacao-aft-2026-12-03_story_v2.png">${conteudo('story')}</section></div>` +
  `<div class="wrap feed"><section class="slide" data-out="convite-confraternizacao-aft-2026-12-03_feed_v2.png">${conteudo('feed')}</section></div>`;
const exp = new URLSearchParams(location.search).has('export');
if (exp) document.body.classList.add('export');
const fit = () => document.querySelectorAll('.wrap').forEach(w => { w.querySelector('.slide').style.transform = exp ? 'none' : `scale(${w.clientWidth / 1080})`; });
addEventListener('resize', fit); fit();
</script>
