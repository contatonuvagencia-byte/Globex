<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'UI'; font-weight: 400; src: url(../nuv-kit-feed/assets/fonts/inter-latin-400-normal.woff2); }
@font-face { font-family: 'UI'; font-weight: 700; src: url(../nuv-kit-feed/assets/fonts/inter-latin-700-normal.woff2); }
body { margin: 0; background: #fff; font-family: 'UI', sans-serif; color: #000; width: 1080px; }
.top { display: flex; align-items: center; gap: 56px; padding: 48px 40px 20px; }
.av { width: 170px; height: 170px; border-radius: 50%; background: #0A2540; display: flex; align-items: center; justify-content: center; flex: none; border: 4px solid #fff; box-shadow: 0 0 0 3px #dbdbdb; }

.st { display: flex; gap: 60px; text-align: center; font-size: 26px; } .st b { display: block; font-size: 32px; }
.bio { padding: 0 40px 26px; font-size: 25px; line-height: 1.4; } .bio a { color: #00376B; font-weight: 700; }
.tabs { border-top: 1px solid #dbdbdb; display: flex; justify-content: space-around; padding: 18px 0; font-size: 22px; font-weight: 700; letter-spacing: .1em; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.grid div { aspect-ratio: 3 / 4; background-size: cover; background-position: center; position: relative; }
.grid div i { position: absolute; right: 12px; top: 12px; width: 30px; height: 30px; border: 4px solid #fff; border-radius: 6px; box-shadow: -7px 7px 0 -3px rgba(255,255,255,.9); }
</style></head><body>
<div class="top"><div class="av"><img src="../nuv-kit-feed/assets/logo/nuv-simbolo-offwhite.png"></div>

</script></body></html>
