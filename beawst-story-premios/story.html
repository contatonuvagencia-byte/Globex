<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story Prêmios</title>
<!--
  Story dos presentes (1080x1920). ?guia=1 mostra onde colar o link.
  Gerar: node render.mjs · Zona segura: nada de texto nos 250px de cima nem nos 340px de baixo.
-->
<style>
@font-face{font-family:M;font-weight:500;src:url(assets/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(assets/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(assets/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(assets/montserrat-latin-900-normal.woff2)}
:root{--roxo:#5B00D6;--magenta:#A3127F;--vermelho:#F0102A;--escuro:#0E0716;
  --gradL:linear-gradient(90deg,#B98CFF 0%,#FF6BB5 50%,#FF6B6B 100%)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--escuro)}
body{font-family:M,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;position:relative}
.abs{position:absolute}
.glow{position:absolute;border-radius:50%;filter:blur(130px)}
.gradL{background:var(--gradL);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;font-weight:800;font-size:28px;letter-spacing:.14em;text-transform:uppercase;background:var(--roxo);padding:14px 26px;border-radius:999px}
.huge{font-weight:900;line-height:1;letter-spacing:-.025em}
.nome{font-weight:900;font-size:62px;line-height:1.02;letter-spacing:-.02em}
.desc{font-weight:700;font-size:38px;line-height:1.25;color:rgba(255,255,255,.9);margin-top:16px}
.halo{position:absolute;border-radius:50%;background:radial-gradient(circle,#A3127F 0%,#5B00D6 45%,transparent 70%);filter:blur(28px)}
.guide{position:absolute;left:150px;right:150px;border:5px dashed #fff;border-radius:36px;display:none;align-items:center;justify-content:center;
  font-weight:800;font-size:32px;letter-spacing:.08em;background:rgba(255,255,255,.1)}
body.guia .guide{display:flex}
</style>
</head>
<body>
  <div class="glow" style="width:900px;height:900px;background:var(--roxo);opacity:.65;left:-300px;top:-150px"></div>
  <div class="glow" style="width:800px;height:800px;background:var(--vermelho);opacity:.35;left:520px;top:1150px"></div>

  <div class="abs" style="left:0;width:100%;top:278px;text-align:center"><img src="assets/logo-feira-branco.svg" style="width:340px;display:inline-block"></div>
  <div class="abs" style="left:90px;right:90px;top:405px;text-align:center">
    <span class="pill">presentes exclusivos</span>
    <div class="huge" style="font-size:100px;margin-top:26px">Tem presente<br>na <span class="gradL">feira!</span></div>
  </div>

  <!-- kit -->
  <div class="halo" style="left:40px;top:740px;width:420px;height:360px;opacity:.6"></div>
  <img class="abs" src="assets/kit.png" style="left:30px;top:670px;width:440px">
  <div class="abs" style="left:490px;right:80px;top:800px">
    <div class="nome">Kit viajante</div>
    <div class="desc">sorteado <b style="color:#fff">de hora em hora</b> pra quem estiver ao vivo</div>
  </div>

  <!-- mala -->
  <div class="halo" style="left:610px;top:1080px;width:440px;height:420px;opacity:.85"></div>
  <img class="abs" src="assets/mala.png" style="left:610px;top:1040px;width:430px">
  <div class="abs" style="left:90px;right:490px;top:1160px">
    <div class="nome gradL">Mala de viagem</div>
    <div class="desc">pra quem ficar <b style="color:#fff">até o fim</b></div>
  </div>
  <div class="abs" style="left:90px;right:490px;top:1385px;font-weight:800;font-size:40px">Garanta sua vaga
    <svg width="34" height="44" viewBox="0 0 70 90" style="vertical-align:middle;margin-left:8px"><path d="M35 6v70M10 52l25 26 25-26" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="guide" style="top:1465px;height:108px">LINK DE INSCRIÇÃO</div>

<script>if (new URLSearchParams(location.search).get('guia')) document.body.classList.add('guia');</script>
</body>
</html>
