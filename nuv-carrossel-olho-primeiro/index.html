<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NUV carrossel</title>
<style>
  /* Identidade NUV: títulos em Perandory Condensed (caixa alta), apoio em Comfortaa.
     Regra principal: texto sempre sobre área sólida (azul ou off-white), nunca sobre detalhe de foto. */
  @font-face { font-family: 'Display'; src: url(assets/fonts/Perandory-Condensed.otf); }
  @font-face { font-family: 'Comfortaa'; font-weight: 400; src: url(assets/fonts/comfortaa-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Comfortaa'; font-weight: 700; src: url(assets/fonts/comfortaa-latin-700-normal.woff2) format('woff2'); }

  :root { --off: #EFEAE4; --beige: #CBC5B9; --navy: #0A2540; --indigo: #313D65; --M: 96px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #222; display: flex; flex-direction: column; gap: 40px; padding: 40px; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: 'Comfortaa', sans-serif; flex: none; background: var(--navy); color: var(--off); }
  .slide.light { background: var(--off); color: var(--navy); }
  .abs { position: absolute; }

  .ph { position: absolute; background-repeat: no-repeat; }
  .fade { position: absolute; left: 0; right: 0; pointer-events: none; }

  /* cabeçalho */
  .hdr { position: absolute; left: var(--M); right: var(--M); top: 76px; display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 15px; letter-spacing: .34em; text-transform: uppercase; z-index: 5; }
  .hdr img { height: 30px; }
  .hdr .line { flex: 1; height: 1.5px; background: currentColor; opacity: .35; }
  .hdr .pg { letter-spacing: .18em; }

  .t { font-family: 'Display', serif; font-weight: 400; line-height: 1.02; letter-spacing: .01em; text-transform: uppercase; }
  .t em { font-style: normal; color: var(--beige); }
  .light .t em { color: var(--indigo); }
  .lead { font-size: 30px; line-height: 1.42; }
  .lead b { font-weight: 700; }
  .u { font-weight: 700; font-size: 24px; line-height: 1.5; letter-spacing: .06em; text-transform: uppercase; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 7px; }
  .box { display: inline; background: var(--beige); color: var(--navy); padding: 6px 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; font-weight: 700; line-height: 1.75; }
  .light .box { background: var(--navy); color: var(--off); }
  .kicker { font-weight: 700; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; }
  .pic { position: absolute; overflow: hidden; border-radius: 28px; }
  .bar { width: 64px; height: 4px; background: var(--beige); border-radius: 2px; }
  .light .bar { background: var(--indigo); }
</style>
</head>
<body>
<script>
const C = { off: '#EFEAE4', beige: '#CBC5B9', navy: '#0A2540', indigo: '#313D65' };
// fotos e tamanhos originais
const IMG = {
  cafe: ['fotos-originais/cafe-mesa.webp', 941, 1672], close: ['fotos-originais/close-celular.webp', 941, 1672],
  livro: ['fotos-originais/livro-xicara.jpg', 736, 981], bolsa: ['fotos-originais/bolsa-notebook.jpg', 736, 1308],
};
// recorte: mostra a região que começa em (sx,sy) com largura sw da foto, dentro de uma caixa w x h
const crop = (key, sx, sy, sw, w, h, extra = '') => {
  const [src, iw] = IMG[key], k = w / sw;
  return `<div class="ph" style="left:0;top:0;width:${w}px;height:${h}px;background-image:url(${src});background-size:${iw * k}px auto;background-position:${-sx * k}px ${-sy * k}px;${extra}"></div>`;
};
const HDR = (pg, light) => `<div class="hdr"><img src="assets/logo/nuv-simbolo-${light ? 'navy' : 'offwhite'}.png"><span>nuv agência</span><span class="line"></span><span class="pg">${pg}</span></div>`;
const HEART = c => `<svg width="28" height="25" viewBox="0 0 24 21" style="display:inline-block;vertical-align:-3px;margin-left:8px"><path d="M12 20s-7.6-4.6-9.6-9.4C.9 7 3.3 3.4 7 3.4c2.1 0 3.6 1.1 5 3 1.4-1.9 2.9-3 5-3 3.7 0 6.1 3.6 4.6 7.2C19.6 15.4 12 20 12 20z" fill="${c}"/></svg>`;
// foto no topo que se funde no azul sólido onde fica o texto
const topPhoto = (key, sx, sy, sw, h, solidFrom) => `<div class="abs" style="left:0;top:0;width:1080px;height:${h}px">${crop(key, sx, sy, sw, 1080, h)}</div>
  <div class="fade" style="top:0;height:260px;background:linear-gradient(180deg,rgba(10,37,64,.75),rgba(10,37,64,0))"></div>
  <div class="fade" style="top:${solidFrom - 260}px;height:262px;background:linear-gradient(180deg,rgba(10,37,64,0),rgba(10,37,64,.85) 70%,#0A2540)"></div>
  <div class="fade" style="top:${solidFrom}px;bottom:0;background:#0A2540"></div>`;

const SLIDES = [
  // 1 · capa
  `${topPhoto('cafe', 0, 110, 941, 1350, 820)}
   ${HDR('arrasta →')}
   <div class="abs t" style="left:96px;top:730px;font-size:150px;width:900px;line-height:1.24">O que eu olho<br><em>primeiro</em></div>
   <div class="abs lead" style="left:96px;top:1118px;width:820px">quando um cliente novo me passa o Instagram dele</div>
   <div class="abs u" style="left:96px;top:1210px;color:${C.beige}">e você pode fazer esse teste no seu agora mesmo</div>`,

  // 2 · a bio
  `${HDR('01 / 05', true)}
   <div class="abs t" style="left:96px;top:190px;font-size:250px">A <em>bio</em></div>
   <div class="abs bar" style="left:96px;top:450px"></div>
   <div class="abs lead" style="left:96px;top:490px;width:470px"><span class="box">Eu leio e tento responder três perguntas:</span></div>
   <div class="abs" style="left:96px;top:650px;width:470px;display:flex;flex-direction:column;gap:22px">
     ${['o que a empresa faz', 'pra quem faz', 'e como eu chamo'].map((q, i) => `<div style="display:flex;align-items:center;gap:20px"><span class="t" style="font-size:64px;color:${C.indigo};width:44px">${i + 1}</span><span style="font-weight:700;font-size:30px">${q}</span></div>`).join('')}</div>
   <div class="abs lead" style="left:96px;top:960px;width:470px;font-size:27px">Se eu precisei pensar pra descobrir, o cliente dele também vai precisar, <b>e quase ninguém tem essa paciência.</b></div>
   <div class="pic" style="left:614px;top:490px;width:370px;height:740px">${crop('close', 520, 700, 421, 370, 740)}</div>`,

  // 3 · os 9 primeiros posts (grade com recortes das fotos)
  `${HDR('02 / 05')}
   <div class="abs t" style="left:96px;top:190px;font-size:150px;width:880px">Os <em>9 primeiros</em> posts</div>
   <div class="abs u" style="left:96px;top:520px;color:${C.beige}">eles são a vitrine do perfil.</div>
   <div class="abs" style="left:96px;top:610px;display:grid;grid-template-columns:repeat(3,150px);gap:8px;padding:14px;background:${C.off};border-radius:22px">
     ${[['cafe', 380, 900, 420], ['close', 300, 380, 500], ['livro', 300, 300, 420], ['bolsa', 200, 400, 520], ['cafe', 60, 120, 600], ['close', 560, 1100, 380], ['livro', 80, 420, 520], ['cafe', 560, 300, 380], ['bolsa', 380, 640, 300]]
       .map(([k, x, y, w]) => `<div style="position:relative;width:150px;height:150px;overflow:hidden;border-radius:6px">${crop(k, x, y, w, 150, 150)}</div>`).join('')}</div>
   <div class="abs lead" style="left:640px;top:640px;width:344px;font-size:28px">Olhando só pra eles, eu já percebo se a marca tem <b>uma cara definida</b> ou se cada post parece ter sido feito por uma pessoa diferente.</div>`,

  // 4 · os destaques
  `${HDR('03 / 05', true)}
   <div class="abs t" style="left:96px;top:190px;font-size:170px">Os <em>destaques</em></div>
   <div class="abs u" style="left:96px;top:420px">é onde muita venda acontece em silêncio.</div>
   <div class="abs" style="left:96px;top:530px;width:888px;display:flex;justify-content:space-between">
     ${[['Depoimentos', 'close', 330, 520, 300], ['Bastidores', 'cafe', 560, 300, 300], ['Como funciona', 'bolsa', 360, 600, 300]].map(([l, k, x, y, w]) =>
       `<div style="text-align:center;width:260px"><div style="width:220px;height:220px;margin:0 auto;border-radius:50%;padding:7px;border:3px solid ${C.indigo}"><div style="position:relative;width:200px;height:200px;border-radius:50%;overflow:hidden">${crop(k, x, y, w, 200, 200)}</div></div>
        <div style="font-weight:700;font-size:26px;margin-top:18px">${l}</div></div>`).join('')}</div>
   <div class="abs lead" style="left:96px;top:900px;width:888px">Quando tem depoimento, bastidor e “como funciona”, a pessoa tira as dúvidas sozinha</div>
   <div class="abs lead" style="left:96px;top:1030px;width:888px"><span class="box">e já chega no direct pronta pra fechar.</span></div>`,

  // 5 · os comentários
  `${topPhoto('livro', 0, 200, 736, 760, 700)}
   ${HDR('04 / 05')}
   <div class="abs t" style="left:96px;top:700px;font-size:150px">Os <em>comentários</em></div>
   <div class="abs lead" style="left:96px;top:870px;width:888px">Eu vejo <b>se o dono responde, como responde e quanto tempo demora.</b></div>
   <div class="abs bar" style="left:96px;top:1060px"></div>
   <div class="abs u" style="left:96px;top:1100px;width:888px;color:${C.beige}">pra quem tá chegando, isso mostra como vai ser o atendimento depois da compra.</div>`,

  // 6 · a data do último post
  `${HDR('05 / 05', true)}
   <div class="abs t" style="left:96px;top:190px;font-size:150px;width:900px">A data do<br><em>último post</em></div>
   <div class="pic" style="left:96px;top:540px;width:888px;height:330px">${crop('cafe', 380, 880, 561, 888, 330)}
     <div class="abs kicker" style="left:28px;bottom:26px;background:${C.off};color:${C.navy};padding:12px 20px;border-radius:999px;font-size:17px">último post · há 5 meses</div></div>
   <div class="abs lead" style="left:96px;top:930px;width:888px">Parece bobo, mas <span class="box">perfil parado há meses passa a impressão de empresa parada,</span></div>
   <div class="abs u" style="left:96px;top:1080px">mesmo quando a agenda tá lotada.</div>`,

  // 7 · fechamento
  `${topPhoto('close', 60, 190, 880, 900, 770)}
   ${HDR('fim')}
   <div class="abs t" style="left:96px;top:750px;font-size:110px;width:900px">Esses cinco pontos dizem <em>muito</em></div>
   <div class="abs lead" style="left:96px;top:1000px;width:860px;font-size:28px">sobre quanto o seu Instagram tá ajudando a vender. Se quiser que a gente olhe o seu com esse cuidado,</div>
   <div class="abs lead" style="left:96px;top:1120px;width:700px;font-size:26px"><span class="box">me chama no direct, me conta o que você precisa e eu te mando um orçamento${HEART(C.navy)}</span></div>
   <img class="abs" src="assets/logo/nuv-agencia-offwhite.png" style="right:90px;bottom:84px;width:132px">`,
];
const LIGHT = [false, true, false, true, false, true, false];
SLIDES.forEach((html, i) => {
  const d = document.createElement('div');
  d.className = 'slide' + (LIGHT[i] ? ' light' : ''); d.id = 's' + (i + 1);
  d.innerHTML = html;
  document.body.appendChild(d);
});
</script>
</body>
</html>
