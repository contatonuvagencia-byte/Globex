<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carla Vieira Tours — Embarque</title>
<style>
@font-face { font-family: "Cinzel"; src: url(fonts/Cinzel.woff2) format("woff2"); font-weight: 400 900; }
@font-face { font-family: "Montserrat"; src: url(fonts/Montserrat.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Cormorant"; src: url(fonts/CormorantItalic.woff2) format("woff2"); font-style: italic; font-weight: 300 700; }
:root {
  --wine: #8b0028; --wine-deep: #4e0016; --rose: #e8c3cc; --charcoal: #231f20; --cream: #f6f1ec;
  --silver: #a7a8ab; --silver-dark: #5f6064;
  --silver-grad: linear-gradient(180deg, #f1f1f2 0%, #b9babd 40%, #8a8b8f 62%, #d7d8da 100%);
  --logo-grad: linear-gradient(90deg, #bdbdbf 0%, #9a9b9e 45%, #5a5b5f 100%);
  --u: 10.8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--charcoal); }
body { font-family: "Montserrat", sans-serif; -webkit-font-smoothing: antialiased; }
#stage { position: relative; overflow: hidden; background: var(--charcoal); }
#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
.scene { position: absolute; inset: 0; display: none; overflow: hidden; }
.center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.mask { overflow: hidden; display: block; padding: 0 0.08em; }
.mask > span { display: inline-block; }
.serif { font-family: "Cinzel", serif; font-weight: 400; letter-spacing: 0.04em; }
.ital { font-family: "Cormorant", serif; font-style: italic; font-weight: 400; }
.label { font-family: "Montserrat"; font-weight: 500; letter-spacing: 0.42em; text-transform: uppercase; font-size: calc(var(--u) * 1.6); }
.silver { background: var(--silver-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay; z-index: 60; }
.vignette { position: absolute; inset: 0; pointer-events: none; z-index: 59; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.22) 100%); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 58; pointer-events: none; }
#wipe { position: absolute; top: -20%; height: 140%; width: 160%; left: -30%; z-index: 57; display: none; }
#wipe .band { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; }

/* S1 split-flap board */
#s1 { background: radial-gradient(ellipse at 50% 40%, #2f2a2b, #151213); }
#board { display: flex; flex-direction: column; gap: calc(var(--u) * 0.7); }
#board .hdr { display: flex; justify-content: space-between; color: var(--silver); margin-bottom: calc(var(--u) * 1.4); }
#board .hdr b { color: #fff; font-weight: 500; }
#board .row { display: flex; gap: calc(var(--u) * 0.45); }
.cell { position: relative; width: var(--cw); height: calc(var(--cw) * 1.42); border-radius: calc(var(--u) * 0.45);
  background: linear-gradient(180deg, #3a3435 0%, #2c2728 49.6%, #1c1819 50.4%, #262122 100%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 calc(var(--u) * 0.3) calc(var(--u) * 0.6) rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; overflow: hidden; }
.cell::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(0,0,0,0.55); }
.cell span { font-family: "Montserrat"; font-weight: 500; color: #f3f0ee; font-size: calc(var(--cw) * 0.86); line-height: 1; display: inline-block; }
.cell.hot span { color: var(--rose); }
#board .tag { margin-top: calc(var(--u) * 2); display: flex; align-items: center; gap: calc(var(--u) * 1.2); color: var(--silver); }
#board .dot { width: calc(var(--u) * 1.1); height: calc(var(--u) * 1.1); border-radius: 50%; background: var(--wine); box-shadow: 0 0 calc(var(--u) * 1.4) #c3194d; }

/* S2 slam words */
#s2 .bgword { position: absolute; left: 0; top: 50%; white-space: nowrap; font-family: "Cinzel"; font-size: calc(var(--u) * 30);
  line-height: 1; color: transparent; -webkit-text-stroke: 1.5px currentColor; opacity: 0.16; }
#s2 .word { font-family: "Cinzel"; font-size: calc(var(--u) * 15); line-height: 1; letter-spacing: 0.02em; }
#s2 .sub { margin-top: calc(var(--u) * 2.4); font-size: calc(var(--u) * 7.6); }
#s2 .num { position: absolute; top: 8%; left: 6%; }
#s2 .tick { position: absolute; bottom: 8%; left: 6%; right: 6%; height: 2px; }

/* S3 passport */
#s3 { background: radial-gradient(ellipse at 50% 45%, #fbf8f5, #ece4dd); perspective: calc(var(--u) * 260); }
#pp { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 112); height: calc(var(--u) * 75); transform-style: preserve-3d; }
.portrait #pp { width: calc(var(--u) * 74); height: calc(var(--u) * 100); }
#pp .page { position: absolute; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, #fffdf9, #f4ede4); overflow: hidden;
  box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(78,0,22,0.18); }
.portrait #pp .page { width: 100%; height: 50%; }
#pp .pl { left: 0; border-radius: calc(var(--u) * 1) 0 0 calc(var(--u) * 1); background: linear-gradient(90deg, #f7f0e7, #fffdf9); }
#pp .pr { left: 50%; border-radius: 0 calc(var(--u) * 1) calc(var(--u) * 1) 0; }
.portrait #pp .pl { left: 0; top: 0; bottom: auto; border-radius: calc(var(--u) * 1) calc(var(--u) * 1) 0 0; background: linear-gradient(180deg, #f7f0e7, #fffdf9); }
.portrait #pp .pr { left: 0; top: 50%; bottom: auto; border-radius: 0 0 calc(var(--u) * 1) calc(var(--u) * 1); }
#pp .page .guil { position: absolute; inset: 0; opacity: 0.35; }
#pp .cover { position: absolute; top: 0; bottom: 0; left: 50%; width: 50%; transform-origin: 0 50%; transform-style: preserve-3d; }
.portrait #pp .cover { left: 0; width: 100%; top: 50%; height: 50%; bottom: auto; transform-origin: 50% 0; }
#pp .cover .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: calc(var(--u) * 1); }
#pp .cover .front { background: radial-gradient(ellipse at 40% 35%, #a10b36, #6a001e); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2.4);
  box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(78,0,22,0.35); }
#pp .cover .back { background: linear-gradient(90deg, #fffdf9, #f4ede4); transform: rotateY(180deg); }
.portrait #pp .cover .back { transform: rotateX(180deg); }
#pp .cover .front .t1 { font-family: "Cinzel"; font-size: calc(var(--u) * 3.6); letter-spacing: 0.24em; }
#pp .cover .front .t2 { font-size: calc(var(--u) * 1.3); color: var(--rose); }
#pp .info { position: absolute; left: 9%; top: 12%; right: 9%; color: var(--charcoal); }
#pp .info .k { font-size: calc(var(--u) * 1.1); color: var(--silver-dark); letter-spacing: 0.3em; margin-top: calc(var(--u) * 2); }
#pp .info .v { font-family: "Cinzel"; font-size: calc(var(--u) * 3.2); margin-top: calc(var(--u) * 0.5); }
#pp .info .v.i { font-family: "Cormorant"; font-style: italic; color: var(--wine); font-size: calc(var(--u) * 3.6); }
.stamp { position: absolute; left: 0; top: 0; }

/* S4 boarding pass */
#s4 { background: radial-gradient(ellipse at 50% 50%, #2d2829, #141112); }
#bp { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 146); height: calc(var(--u) * 58); display: flex; }
.portrait #bp { width: calc(var(--u) * 60); height: calc(var(--u) * 114); flex-direction: column; }
#bp .main, #bp .stub { position: relative; background: var(--cream); overflow: hidden; }
#bp .main { flex: 1; border-radius: calc(var(--u) * 1.6) 0 0 calc(var(--u) * 1.6); padding: calc(var(--u) * 4) calc(var(--u) * 5); }
#bp .stub { width: calc(var(--u) * 34); border-radius: 0 calc(var(--u) * 1.6) calc(var(--u) * 1.6) 0; padding: calc(var(--u) * 4) calc(var(--u) * 3.4);
  border-left: 2px dashed #c9bfb6; }
.portrait #bp .main { border-radius: calc(var(--u) * 1.6) calc(var(--u) * 1.6) 0 0; padding: calc(var(--u) * 5) calc(var(--u) * 5); }
.portrait #bp .stub { width: auto; height: calc(var(--u) * 30); border-radius: 0 0 calc(var(--u) * 1.6) calc(var(--u) * 1.6); border-left: 0; border-top: 2px dashed #c9bfb6; }
#bp .band { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 7.5); background: var(--wine); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(var(--u) * 5); color: #fff; }
#bp .stub .band { padding: 0 calc(var(--u) * 3.4); }
#bp .band .b1 { font-family: "Cinzel"; font-size: calc(var(--u) * 2.4); letter-spacing: 0.18em; }
#bp .band .b2 { font-size: calc(var(--u) * 1.2); color: var(--rose); }
#bp .fields { margin-top: calc(var(--u) * 7.5); display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 3) calc(var(--u) * 4); }
.portrait #bp .fields { margin-top: calc(var(--u) * 8.5); grid-template-columns: 1fr; gap: calc(var(--u) * 3); }
#bp .f .k { font-size: calc(var(--u) * 1.15); letter-spacing: 0.32em; color: var(--silver-dark); }
#bp .f .v { font-family: "Cinzel"; font-size: calc(var(--u) * 3.4); color: var(--charcoal); margin-top: calc(var(--u) * 0.6); white-space: nowrap; min-height: 1.2em; }
#bp .f .v.w { color: var(--wine); }
#bp .f.wide { grid-column: 1 / -1; }
#bp .f .v .car { display: inline-block; width: 2px; height: 0.9em; background: var(--wine); margin-left: 3px; vertical-align: -0.1em; }
#bp .route { display: flex; align-items: center; justify-content: space-between; margin-top: calc(var(--u) * 8.5); }
.portrait #bp .route { margin-top: calc(var(--u) * 9); }
#bp .route .code { font-family: "Cinzel"; font-size: calc(var(--u) * 4.8); color: var(--charcoal); }
#bp .route svg { width: calc(var(--u) * 8); height: calc(var(--u) * 4); }
#bp .bar { position: absolute; left: calc(var(--u) * 3.4); right: calc(var(--u) * 3.4); bottom: calc(var(--u) * 4); height: calc(var(--u) * 9); }
.portrait #bp .bar { left: calc(var(--u) * 5); right: calc(var(--u) * 5); bottom: calc(var(--u) * 3.5); height: calc(var(--u) * 7); }
#s4 .hint { position: absolute; left: 0; right: 0; bottom: 7%; text-align: center; color: var(--silver); font-size: calc(var(--u) * 1.9); }
.portrait #s4 .hint { bottom: 6%; font-size: calc(var(--u) * 1.4); padding: 0 calc(var(--u) * 6); line-height: 1.8; }

/* S5 marquee */
#s5 { background: radial-gradient(ellipse at 50% 50%, #9d0932, #4e0016); }
#rows { position: absolute; left: -30%; right: -30%; top: 50%; transform: translateY(-50%) rotate(-7deg); display: flex; flex-direction: column; gap: calc(var(--u) * 2); }
#rows .r { white-space: nowrap; font-size: calc(var(--u) * 7.2); line-height: 1.1; color: rgba(255,255,255,0.92); }
#rows .r.ital { color: var(--rose); font-size: calc(var(--u) * 8.2); }
#rows .r.out { color: transparent; -webkit-text-stroke: 1.2px rgba(255,255,255,0.45); }
#rows .r i.sep { font-style: normal; display: inline-block; margin: 0 0.5em; color: var(--silver); font-family: "Montserrat"; font-size: 0.4em; vertical-align: 0.5em; }
#s5 .card { position: absolute; left: 50%; top: 50%; background: var(--cream); padding: calc(var(--u) * 4.4) calc(var(--u) * 7); text-align: center;
  box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 8) rgba(0,0,0,0.4); }
#s5 .card .serif { font-size: calc(var(--u) * 5.4); color: var(--charcoal); line-height: 1.1; }
#s5 .card .ital { font-size: calc(var(--u) * 7); color: var(--wine); line-height: 1.05; }

/* S6 split stats */
#s6 { background: var(--charcoal); display: none; }
#panels { position: absolute; inset: 0; display: flex; }
.portrait #panels { flex-direction: column; }
#panels .p { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
#panels .p .n { font-family: "Cinzel"; font-size: calc(var(--u) * 17); line-height: 1; }
#panels .p .l { margin-top: calc(var(--u) * 2); }
#panels .p .s { margin-top: calc(var(--u) * 1); font-size: calc(var(--u) * 3.6); }
#panels .p1 { background: var(--wine); color: #fff; } #panels .p1 .l { color: var(--rose); } #panels .p1 .s { color: var(--rose); }
#panels .p2 { background: var(--charcoal); color: #fff; } #panels .p2 .l { color: var(--silver); } #panels .p2 .s { color: var(--rose); }
#panels .p3 { background: var(--cream); color: var(--charcoal); } #panels .p3 .l { color: var(--wine); } #panels .p3 .s { color: var(--wine); }
#panels .p3 .n { font-size: calc(var(--u) * 12); }

/* S7 globe + ring */
#s7 { background: radial-gradient(ellipse at 50% 50%, #2d2829, #131011); }
#globe { position: absolute; left: 50%; top: 50%; }
#s7 .cap { position: absolute; left: 0; right: 0; text-align: center; }
#s7 .cap.top { top: 9%; } #s7 .cap.bot { bottom: 9%; }
#s7 .cap .serif { font-size: calc(var(--u) * 6.2); color: #fff; }
#s7 .cap .ital { font-size: calc(var(--u) * 8); color: var(--rose); line-height: 1; }

/* S8 logo */
#s8 { background: radial-gradient(ellipse at 50% 45%, #ffffff 0%, #f3eeea 100%); z-index: 5; }
#s8 .logo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#s8 .word { display: flex; align-items: flex-end; font-family: "Cinzel"; font-weight: 400; line-height: 0.8; letter-spacing: 0.02em; }
#s8 .word span { display: inline-block; background: var(--logo-grad); background-size: var(--wordw) 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
#s8 .rule { height: 1px; background: #a7a8ab; margin-top: calc(var(--u) * 1.6); }
#s8 .tours { margin-top: calc(var(--u) * 2.2); }
#s8 .tagline { margin-top: calc(var(--u) * 6); font-size: calc(var(--u) * 4.6); color: var(--wine); }
#s8 .foot { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; color: var(--silver-dark); font-size: calc(var(--u) * 1.5); }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <section class="scene" id="s1"><div class="center"><div id="board"></div></div></section>
    <section class="scene" id="s2"></section>
    <section class="scene" id="s3"><div id="pp"></div></section>
    <section class="scene" id="s4"><div id="bp"></div><div class="label hint" id="bphint">seu cartão de embarque para o extraordinário</div></section>
    <section class="scene" id="s5"><div id="rows"></div>
      <div class="card" id="s5card"><div class="mask serif"><span>Experiências que</span></div><div class="mask ital"><span>viram memória.</span></div></div>
    </section>
    <section class="scene" id="s6"><div id="panels"></div></section>
    <section class="scene" id="s7">
      <svg id="globe"></svg>
      <div class="cap top"><div class="mask serif"><span>A gente cuida de tudo.</span></div></div>
      <div class="cap bot"><div class="mask ital"><span>Você só vive.</span></div></div>
    </section>
    <section class="scene" id="s8">
      <div class="logo" id="s8logo">
        <div class="word" id="s8word"></div>
        <div class="rule" id="s8rule"></div>
        <svg class="tours" id="s8tours" viewBox="0 0 686.92 152.69"><path fill="#8b0028" d="M19.31 55.52H0V43.07H19.31V0H33.66V43.07H54.71V55.52H33.66v92.57H19.31Zm157.25 83.56c11.52 0 21.29-4.16 29.29-12.48s12-18.51 12-30.59c0-12.24-4-22.46-11.96-30.75s-17.74-12.44-29.33-12.44c-11.52 0-21.25 4.16-29.21 12.44S135.4 83.76 135.4 96c0 12.08 4 22.26 11.96 30.59s17.7 12.48 29.21 12.48Zm-.48 13.62c-7.47 0-14.67-1.49-21.54-4.44s-13.09-7.19-18.71-12.73c-5.290-5.21-9.29-11.19-12.04-17.98-2.79-6.79-4.16-14.06-4.16-21.78 0-7.64 1.41-14.91 4.24-21.78 2.87-6.87 6.91-12.93 12.2-18.22 5.37-5.37 11.47-9.45 18.34-12.32 6.87-2.83 14.1-4.24 21.66-4.24 7.76 0 15.11 1.41 22.1 4.24 6.95 2.87 13.17 6.95 18.63 12.32s9.62 11.47 12.48 18.34 4.32 14.1 4.32 21.66c0 7.6-1.41 14.79-4.24 21.62-2.87 6.83-6.95 12.85-12.32 18.14-5.54 5.54-11.84 9.78-18.87 12.73-7.07 2.95-14.42 4.44-22.1 4.44ZM330.27 43.07V95.52c0 15.92 2.26 27.19 6.83 33.74 4.53 6.55 12.2 9.82 23.03 9.82 10.71 0 18.42-3.31 23.07-9.94s6.99-17.86 6.99-33.62V43.07h14.42v59.88c0 16.36-3.76 28.73-11.23 37.13-7.52 8.4-18.51 12.61-33.05 12.61-14.59 0-25.66-4.2-33.25-12.61-7.56-8.4-11.35-20.77-11.35-37.13V43.07ZM510.03 64.16c5.37-9.09 10.63-15.52 15.8-19.27 5.17-3.8 11.19-5.7 18.06-5.7 2.06 0 4.12.2 6.22.61 2.1.36 4.16.93 6.22 1.62L551.6 55.15c-1.58-.48-3.23-.85-4.93-1.17s-3.31-.49-4.89-.49c-8.77 0-16.28 4.12-22.46 12.32s-9.29 18.42-9.29 30.67v51.6H495.48V43.07h14.55Zm101.94 65.17l13.86-7.92c2.3 5.86 5.62 10.26 9.94 13.21 4.36 2.95 9.66 4.44 16 4.44 6.14 0 11.03-1.58 14.67-4.69s5.45-7.27 5.45-12.48c0-8.04-7.15-14.87-21.41-20.49-1.54-.53-2.71-1.01-3.56-1.41-11.07-4.32-18.79-8.81-23.23-13.41-4.4-4.61-6.63-10.34-6.63-17.09 0-8.93 3.15-16.24 9.5-21.98 6.3-5.7 14.46-8.57 24.48-8.57 8.53 0 15.8 1.86 21.82 5.58 5.98 3.72 10.38 8.97 13.13 15.84l-13.37 7.47c-1.66-4.97-4.44-8.77-8.32-11.35-3.84-2.63-8.57-3.92-14.18-3.92-5.05 0-9.21 1.49-12.48 4.44s-4.93 6.63-4.93 11.07c0 4.32 1.62 7.92 4.85 10.75s9.94 5.98 20.12 9.33c11.56 4.04 19.27 8.4 23.27 13.17 4 4.73 5.98 11.27 5.98 19.64 0 9.62-3.43 17.33-10.3 23.07-6.87 5.78-16.08 8.65-27.72 8.65-8.89 0-16.57-2.02-23.03-6.1-6.42-4.08-11.07-9.82-13.9-17.25"/></svg>
        <div class="mask ital tagline"><span>A viagem dos seus sonhos começa aqui.</span></div>
      </div>
      <div class="label foot" id="s8foot">curadoria · concierge · suporte 24h</div>
    </section>
  </div>
  <div id="wipe"></div>
  <div id="flash"></div>
  <div class="vignette"></div>
  <svg class="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script src="embarque.js"></script>
</body>
</html>
