<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NUV kit de feed</title>
<style>
  /* Kit de feed NUV seguindo de perto a referência "creative studio":
     - manchete pesadíssima, minúscula, letras e linhas coladas (Comfortaa 700 reforçada)
     - destaque em itálico leve (serifa fina) no meio da manchete
     - rótulos pequenos em caixa alta nos cantos, seta fina no rodapé
     - fotos escuras e quentes em tela cheia: só tratamento na própria foto, nenhuma sombra/degradê por cima
     - detalhes à mão: sublinhado grosso, elipse desenhada; frase da marca "estampada" em objeto
     Paleta NUV: off-white #EFEAE4, azul #0A2540, índigo #313D65, bege #CBC5B9. */
  @font-face { font-family: 'Comfortaa'; font-weight: 400; src: url(assets/fonts/comfortaa-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Comfortaa'; font-weight: 700; src: url(assets/fonts/comfortaa-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Accent'; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Display'; src: url(assets/fonts/Perandory-Condensed.otf); }

  :root { --off: #EFEAE4; --beige: #CBC5B9; --navy: #0A2540; --indigo: #313D65; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #222; display: flex; flex-direction: column; gap: 40px; padding: 40px; }
  .post { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: 'Comfortaa', sans-serif; flex: none; background: var(--off); color: var(--navy); }
  .abs { position: absolute; }
  .ph { position: absolute; background-repeat: no-repeat; }

  /* manchete pesada: peso 700 + contorno da mesma cor para chegar ao "black" da referência */
  .H { font-weight: 700; text-transform: lowercase; letter-spacing: -.065em; line-height: .93; -webkit-text-stroke: .05em currentColor; paint-order: stroke fill; }
  .H em { font-family: 'Accent', serif; font-style: italic; font-weight: 400; -webkit-text-stroke: 0; letter-spacing: -.02em; font-size: 1.12em; }
  .s { font-weight: 400; font-size: 19px; letter-spacing: .03em; line-height: 1.28; text-transform: uppercase; }
  .brand { position: absolute; left: 66px; top: 62px; font-weight: 700; font-size: 20px; letter-spacing: .06em; }
  .lab { position: absolute; right: 66px; top: 62px; text-align: left; }
  .foot { position: absolute; left: 66px; bottom: 70px; }
  .arrow { position: absolute; right: 66px; bottom: 74px; }

  /* ---- teste de fontes de título (index.html#perandory | #inter | #archivo | #bricolage) ---- */
  @font-face { font-family: 'HInter'; font-weight: 900; src: url(assets/fonts/inter-tight-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'HInterI'; font-style: italic; font-weight: 300; src: url(assets/fonts/inter-tight-latin-300-italic.woff2) format('woff2'); }
  @font-face { font-family: 'HArch'; font-weight: 900; src: url(assets/fonts/archivo-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'HArchI'; font-style: italic; font-weight: 300; src: url(assets/fonts/archivo-latin-300-italic.woff2) format('woff2'); }
  @font-face { font-family: 'HBrico'; font-weight: 800; src: url(assets/fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2'); }
  body.f-perandory .H { font-family: 'Display', serif; font-weight: 400; text-transform: uppercase; letter-spacing: .005em; -webkit-text-stroke: 0; line-height: .86; }
  body.f-perandory .H { transform: scale(1.32); transform-origin: 0 0; }
  body.f-perandory .ul { display: none; }
  body.f-perandory [id="05_mesmo_instagram_resultado_diferente"] .H + .H { top: 1060px !important; transform: none; }
  body.f-perandory [id="05_mesmo_instagram_resultado_diferente"] .H { top: 650px !important; }
  body.f-perandory [id="10_marcas_crescem_aqui"] .H:nth-of-type(3) { top: 760px !important; left: 170px !important; }
  body.f-perandory [id="10_marcas_crescem_aqui"] .abs:has(svg) { top: 770px !important; }
  body.f-inter .H { font-family: 'HInter', sans-serif; font-weight: 900; letter-spacing: -.055em; -webkit-text-stroke: 0; line-height: .88; word-spacing: .12em; }
  body.f-inter .H em { font-family: 'HInterI', sans-serif; font-weight: 300; letter-spacing: -.04em; font-size: 1em; }
  body.f-archivo .H { font-family: 'HArch', sans-serif; font-weight: 900; letter-spacing: -.05em; -webkit-text-stroke: 0; line-height: .88; }
  body.f-archivo .H em { font-family: 'HArchI', sans-serif; font-weight: 300; letter-spacing: -.035em; font-size: 1em; }
  body.f-bricolage .H { font-family: 'HBrico', sans-serif; font-weight: 800; letter-spacing: -.05em; -webkit-text-stroke: 0; line-height: .88; }
  body.f-bricolage .H em { font-family: 'HInterI', sans-serif; font-weight: 300; letter-spacing: -.04em; font-size: 1em; }
</style>
</head>
<body>
<script>if (location.hash) document.body.className = 'f-' + location.hash.slice(1);</script>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter>
</defs></svg>
<script>
const C = { off: '#EFEAE4', beige: '#CBC5B9', navy: '#0A2540', indigo: '#313D65' };
const IMG = {
  cafe: ['fotos-hd/cafe-mesa.jpg', 941], close: ['fotos-hd/close-celular.jpg', 941], retrato: ['fotos-hd/retrato-estudio.jpg', 941],
  tablet: ['fotos-hd/tablet-cafe.jpg', 1122], bolsa: ['fotos-hd/bolsa-notebook.jpg', 736], rua: ['fotos-hd/rua-bolsa-cafe.jpg', 736],
  maos: ['fotos-hd/maos-caderno.jpg', 736], pool: ['fotos-hd/piscina-xicaras.jpg', 736], livro: ['fotos-hd/livro-xicara.jpg', 736],
};
// tratamento "moody" aplicado na própria foto (nada por cima dela)
const MOODY = 'filter:brightness(.62) contrast(1.18) saturate(.82) sepia(.12)';
const crop = (key, sx, sy, sw, w, h, extra = '') => {
  const [src, iw] = IMG[key], k = w / sw;
  return `<div class="ph" style="left:0;top:0;width:${w}px;height:${h}px;background-image:url(${src});background-size:${iw * k}px auto;background-position:${-sx * k}px ${-sy * k}px;${extra}"></div>`;
};
const full = (key, sx, sy, sw, extra = MOODY) => `<div class="abs" style="left:0;top:0;width:1080px;height:1350px;overflow:hidden">${crop(key, sx, sy, sw, 1080, 1350, extra)}</div>`;
const GRAIN = o => `<svg class="abs" style="left:0;top:0;opacity:${o};mix-blend-mode:overlay;pointer-events:none" width="1080" height="1350"><rect width="100%" height="100%" filter="url(#grain)"/></svg>`;
const ARROW = c => `<svg class="arrow" width="72" height="30" viewBox="0 0 72 30"><path d="M2 15h66M54 2l14 13-14 13" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const BRAND = c => `<div class="brand" style="color:${c}">NUV</div>`;
const LAB = (t, c) => `<div class="lab s" style="color:${c}">${t}</div>`;
const FOOT = (t, c) => `<div class="foot s" style="color:${c}">${t}</div>`;
const BLOB = 'M150 70C300-10 470 70 590 40C740 0 900 70 880 240C866 370 950 450 905 590C860 730 960 850 820 950C690 1040 520 950 400 975C250 1005 80 1010 55 860C30 720 130 640 75 510C10 350 0 160 150 70Z';
// elipse desenhada à mão
const ELLIPSE = (w, h, c) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible"><path d="M${w * .18} ${h * .2}C${w * .55} ${-h * .08} ${w * 1.02} ${h * .12} ${w * .98} ${h * .5}C${w * .95} ${h * .92} ${w * .3} ${h * 1.04} ${w * .06} ${h * .72}C${-w * .08} ${h * .5} ${w * .12} ${h * .16} ${w * .5} ${h * .08}" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/></svg>`;

const POSTS = {
  '01_ideias_constroem_marcas': `${BRAND(C.navy)}${LAB('agência de social media', C.navy)}
    <div class="abs H" style="left:56px;top:190px;font-size:200px;color:${C.navy}">ideias<br>constroem<br>marcas.</div>
    <div class="abs ul" style="left:64px;top:560px;width:840px;height:14px;background:${C.navy};border-radius:7px"></div>
    <div class="foot" style="color:${C.navy};font-size:22px;line-height:1.3">Estratégia.<br>Design.<br>Conteúdo.<br>Pro que vem depois.</div>${ARROW(C.navy)}`,

  '02_nao_e_sorte_e_processo': `${full('tablet', 0, 0, 1122)}${GRAIN(.14)}
    ${BRAND(C.off)}${LAB('pessoas<br>ideias<br>resultados', C.off)}
    <div class="abs H" style="left:56px;top:160px;font-size:132px;color:${C.off}">não é “sorte”.<br>é <em>processo.</em></div>
    ${FOOT('uma agência pra marcas<br>que pensam longe.', C.off)}`,

  '03_marca_boa_e_lembrada': `${full('bolsa', 0, 60, 736, 'filter:brightness(1.02) contrast(1.06) saturate(.85)')}${GRAIN(.1)}
    ${BRAND(C.navy)}
    <div class="abs H" style="left:56px;top:170px;font-size:140px;color:${C.indigo}">marca<br>boa é<br>lembrada.</div>
    <div class="abs s" style="left:66px;top:590px;color:${C.navy}">marca<br>estratégia<br>social media<br>landing pages</div>`,

  '04_do_scroll_a_venda': `${full('cafe', 0, 0, 941)}${GRAIN(.14)}
    ${BRAND(C.off)}${LAB('social<br>media<br>que<br>funciona.', C.off)}
    <div class="abs H" style="left:56px;top:150px;font-size:170px;color:${C.off}">do scroll<br>à venda.</div>
    ${FOOT('ideias<br>sistemas<br>crescimento', C.off)}`,

  '05_mesmo_instagram_resultado_diferente': `${full('close', 60, 380, 760)}${GRAIN(.14)}
    ${BRAND(C.off)}
    <div class="abs H" style="left:56px;top:690px;font-size:150px;color:${C.off}">mesmo<br>instagram</div>
    <div class="abs H" style="left:56px;top:950px;font-size:116px;color:${C.beige}"><em style="font-size:1em">(resultado diferente)</em></div>
    <div class="abs s" style="right:66px;bottom:70px;color:${C.off}">estratégia<br>criação<br>execução<br>crescimento real</div>`,

  '06_precisa_mesmo_de_um_site': `${BRAND(C.navy)}${LAB('landing pages', C.navy)}
    <div class="abs H" style="left:56px;top:330px;font-size:150px;color:${C.navy}">você precisa<br><em style="color:${C.indigo}">mesmo</em> de<br>um site?</div>
    ${FOOT('sim. e a gente te conta<br>por que isso muda tudo.', C.navy)}${ARROW(C.navy)}`,

  '07_hold_the_vision_estampado': `${full('retrato', 0, 300, 941, 'filter:brightness(.8) contrast(1.12) saturate(.85) sepia(.1)')}${GRAIN(.14)}
    ${BRAND(C.navy)}
    <div class="abs" style="left:430px;top:1000px;transform:rotate(-4deg);font-family:'Display',serif;font-size:96px;line-height:.86;color:${C.beige};opacity:.82;mix-blend-mode:screen;filter:blur(.4px)">hold the<br>vision.<br>trust the<br>process.</div>
    <div class="abs s" style="right:66px;bottom:70px;color:${C.off}">pessoas<br>projetos<br>propósito</div>`,

  '08_sua_visao_nosso_trabalho': `<div class="abs" style="left:0;top:0;width:1080px;height:1350px;background:${C.indigo}"></div>${GRAIN(.1)}
    ${BRAND(C.off)}${LAB('trabalhe<br>com a gente', C.off)}
    <div class="abs H" style="left:56px;top:260px;font-size:200px;color:${C.off}">sua<br>visão,<br>nosso<br>trabalho.</div>
    ${FOOT('vamos criar algo<br>que faça sentido<br>pra sua marca.', C.off)}${ARROW(C.off)}`,

  '09_mais_que_conteudo': `${full('livro', 0, 0, 736)}${GRAIN(.14)}
    ${BRAND(C.off)}
    <div class="abs H" style="left:56px;top:170px;font-size:150px;color:${C.off}">mais que<br>conteúdo</div>
    <div class="abs s" style="left:66px;top:470px;color:${C.off}">uma parceira<br>no seu crescimento.</div>
    ${FOOT('marca<br>estratégia<br>social media<br>landing pages', C.off)}`,

  '10_marcas_crescem_aqui': `${BRAND(C.navy)}
    <div class="abs H" style="left:56px;top:250px;font-size:220px;color:${C.navy}">marcas<br>crescem</div>
    <div class="abs H" style="left:150px;top:640px;font-size:230px;color:${C.navy}">aqui.</div>
    <div class="abs" style="left:80px;top:610px">${ELLIPSE(720, 300, C.navy)}</div>
    ${FOOT('soluções criativas<br>pro seu próximo passo.', C.navy)}${ARROW(C.navy)}`,

  '11_combustivel_pra_grandes_ideias': `${full('pool', 0, 0, 736, 'filter:brightness(.62) contrast(1.15) saturate(.4) sepia(.18)')}${GRAIN(.14)}
    ${BRAND(C.off)}${LAB('boas<br>ideias<br>marcas<br>melhores', C.off)}
    <div class="abs H" style="left:56px;top:170px;font-size:150px;color:${C.off}">combustível<br>pra grandes<br>ideias.</div>`,

  '12_estrategia_design_conteudo': `${BRAND(C.navy)}${LAB('vamos<br>conversar', C.navy)}
    <div class="abs" style="left:90px;top:150px;width:900px;height:980px;clip-path:path('${BLOB}')">${crop('cafe', 0, 150, 941, 900, 980, MOODY)}</div>
    <div class="abs H" style="left:250px;top:420px;font-size:118px;color:${C.off}">estratégia<br>design<br>conteúdo<br><span style="color:${C.beige}">resultado.</span></div>
    ${FOOT('uma agência pra marcas<br>que querem crescer.', C.navy)}${ARROW(C.navy)}`,
};
Object.entries(POSTS).forEach(([id, html]) => {
  const d = document.createElement('div');
  d.className = 'post'; d.id = id;
  d.innerHTML = html;
  document.body.appendChild(d);
});
</script>
</body>
</html>
