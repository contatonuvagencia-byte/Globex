<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NUV kit de feed</title>
<style>
  /* Kit de posts NUV — referências traduzidas para a identidade da marca:
     - Ref. 1 (tipografia gigante + foto quente): Perandory Condensed enorme, cantos com rótulos pequenos, seta
     - Ref. 2 (clean + interface): pílulas, marca-texto em bloco, papel texturizado, serifa itálica de destaque
     Paleta NUV: azul #0A2540, índigo #313D65, off-white #EFEAE4, bege #CBC5B9 (+ preto nas fotos). */
  @font-face { font-family: 'Display'; src: url(assets/fonts/Perandory-Condensed.otf); }
  @font-face { font-family: 'Accent'; font-style: italic; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Comfortaa'; font-weight: 400; src: url(assets/fonts/comfortaa-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Comfortaa'; font-weight: 700; src: url(assets/fonts/comfortaa-latin-700-normal.woff2) format('woff2'); }

  :root { --off: #EFEAE4; --beige: #CBC5B9; --navy: #0A2540; --indigo: #313D65; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #222; display: flex; flex-direction: column; gap: 40px; padding: 40px; }
  .post { position: relative; width: 1080px; height: 1350px; overflow: hidden; font-family: 'Comfortaa', sans-serif; flex: none; background: var(--off); color: var(--navy); }
  .abs { position: absolute; }
  .ph { position: absolute; background-repeat: no-repeat; }
  .fade { position: absolute; left: 0; right: 0; pointer-events: none; }

  .brand { position: absolute; left: 70px; top: 64px; font-weight: 700; font-size: 24px; letter-spacing: .32em; }
  .lab { position: absolute; right: 70px; top: 66px; font-weight: 700; font-size: 16px; letter-spacing: .14em; line-height: 1.45; text-transform: uppercase; text-align: right; }
  .foot { position: absolute; left: 70px; bottom: 70px; font-weight: 700; font-size: 20px; letter-spacing: .06em; line-height: 1.45; text-transform: uppercase; }
  .arrow { position: absolute; right: 70px; bottom: 74px; }
  .H { font-family: 'Display', serif; font-weight: 400; text-transform: uppercase; line-height: .84; letter-spacing: .005em; }
  .I { font-family: 'Accent', serif; font-style: italic; font-weight: 400; line-height: .9; letter-spacing: -.01em; text-transform: none; }
  .p { font-size: 30px; line-height: 1.42; }
  .p b { font-weight: 700; }
  .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 18px 34px; font-weight: 700; font-size: 27px; white-space: nowrap; }
  .pill.fill { background: var(--navy); color: var(--off); }
  .pill.line { border: 2.5px solid var(--navy); color: var(--navy); background: rgba(239,234,228,.7); }
  .mk { display: inline-block; background: var(--navy); color: var(--off); padding: 6px 22px 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="7" result="n"/>
      <feDiffuseLighting in="n" lighting-color="#fff" surfaceScale="2.2" result="l"><feDistantLight azimuth="45" elevation="58"/></feDiffuseLighting>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0"/></filter>
  </defs>
</svg>
<script>
const C = { off: '#EFEAE4', beige: '#CBC5B9', navy: '#0A2540', indigo: '#313D65' };
const IMG = {
  cafe: ['fotos-hd/cafe-mesa.jpg', 941], close: ['fotos-hd/close-celular.jpg', 941], retrato: ['fotos-hd/retrato-estudio.jpg', 941],
  tablet: ['fotos-hd/tablet-cafe.jpg', 1122], bolsa: ['fotos-hd/bolsa-notebook.jpg', 736], rua: ['fotos-hd/rua-bolsa-cafe.jpg', 736],
  maos: ['fotos-hd/maos-caderno.jpg', 736], pool: ['fotos-hd/piscina-xicaras.jpg', 736], livro: ['fotos-hd/livro-xicara.jpg', 736],
};
// mostra a região da foto que começa em (sx,sy) com largura sw (medidas da foto original), numa caixa w x h
const crop = (key, sx, sy, sw, w, h, extra = '') => {
  const [src, iw] = IMG[key], k = w / sw;
  return `<div class="ph" style="left:0;top:0;width:${w}px;height:${h}px;background-image:url(${src});background-size:${iw * k}px auto;background-position:${-sx * k}px ${-sy * k}px;${extra}"></div>`;
};
const box = (x, y, w, h, inner, extra = '') => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden;${extra}">${inner}</div>`;
const GRAIN = o => `<svg class="abs" style="left:0;top:0;opacity:${o};mix-blend-mode:overlay;pointer-events:none" width="1080" height="1350"><rect width="100%" height="100%" filter="url(#grain)"/></svg>`;
const ARROW = c => `<svg class="arrow" width="76" height="34" viewBox="0 0 76 34"><path d="M2 17h70M56 3l16 14-16 14" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const BRAND = c => `<div class="brand" style="color:${c}">NUV</div>`;
const LAB = (t, c) => `<div class="lab" style="color:${c}">${t}</div>`;
const FOOT = (t, c, extra = '') => `<div class="foot" style="color:${c};${extra}">${t}</div>`;
const BLOB = 'M120 80C260-20 470 60 560 30C700-15 880 40 870 220C862 360 940 430 900 560C860 700 950 820 820 930C700 1030 520 940 400 960C260 985 90 1000 60 860C30 720 120 640 70 520C-10 340-20 180 120 80Z';

const POSTS = {
  // 1 · tipografia gigante sobre off-white
  '01_ideias_constroem_marcas': `${BRAND(C.navy)}${LAB('agência de<br>social media', C.navy)}
    <div class="abs H" style="left:64px;top:190px;font-size:288px;color:${C.navy}">Ideias que<br>constroem<br>marcas.</div>
    <div class="abs" style="left:70px;top:930px;width:560px;height:12px;background:${C.navy}"></div>
    ${FOOT('Estratégia.<br>Design.<br>Conteúdo.<br>Pro que vem depois.', C.navy, 'text-transform:none;letter-spacing:.02em;font-size:24px')}${ARROW(C.navy)}`,

  // 2 · retrato no estúdio: texto azul direto na parede lisa (sem sombra/degradê)
  '02_nao_e_sorte_e_processo': `<div class="abs" style="left:0;top:0;width:1080px;height:1350px;background:#b1aaa1"></div>
    ${box(0, 110, 1080, 1240, crop('retrato', 0, 0, 941, 1080, 1240))}
    ${GRAIN(.12)}${BRAND(C.navy)}${LAB('estratégia<br>conteúdo<br>resultado', C.navy)}
    <div class="abs H" style="left:66px;top:150px;font-size:180px;color:${C.navy}">Não é sorte.</div>
    <div class="abs I" style="left:70px;top:312px;font-size:150px;color:${C.indigo}">é processo.</div>
    ${FOOT('Hold the vision.<br>Trust the process.', C.off)}`,

  // 3 · "Prazer, Isabela" (blocos de marca-texto + retrato)
  '03_prazer_isabela': `<div class="abs" style="left:0;top:0;width:1080px;height:1350px;background:${C.off}"></div>
    ${box(560, 260, 450, 1020, crop('tablet', 230, 200, 520, 450, 1020), 'border-radius:225px 225px 30px 30px')}
    ${BRAND(C.navy)}${LAB('fundadora<br>da nuv', C.navy)}
    <div class="abs H" style="left:70px;top:200px;font-size:150px;line-height:1.05"><span class="mk">Prazer,</span><br><span class="mk">Isabela</span></div>
    <div class="abs p" style="left:70px;top:560px;width:450px">Comecei como <b>estagiária</b> numa agência e fui crescendo até criar a NUV.</div>
    <div class="abs p" style="left:70px;top:800px;width:450px">Hoje são <b>mais de 40 clientes</b> em 4 anos.</div>
    <div class="abs pill line" style="left:70px;top:1150px;font-size:22px;padding:16px 28px">conheça a minha história →</div>`,

  // 4 · azul sólido + foto entrando por baixo
  '04_do_scroll_a_venda': `<div class="abs" style="left:0;top:0;width:1080px;height:1350px;background:${C.navy}"></div>
    ${box(0, 780, 1080, 570, crop('cafe', 300, 900, 641, 1080, 570))}
    ${BRAND(C.off)}
    <div class="abs H" style="left:66px;top:180px;font-size:270px;color:${C.off}">Do scroll<br>à venda.</div>
    ${LAB('social media<br>que funciona.', C.beige)}
    <div class="abs" style="left:70px;top:690px;color:${C.off};font-weight:700;font-size:20px;letter-spacing:.06em;line-height:1.45;text-transform:uppercase">ideias · sistemas · crescimento</div>`,

  // 5 · close: texto direto sobre o suéter escuro (sem sombra/degradê)
  '05_mesmo_instagram_resultado_diferente': `${box(0, 0, 1080, 1350, crop('close', 60, 380, 760, 1080, 1350, 'filter:brightness(.94) contrast(1.04)'))}
    ${GRAIN(.12)}${BRAND(C.off)}
    <div class="abs H" style="left:66px;top:730px;font-size:150px;color:${C.off}">Mesmo Instagram</div>
    <div class="abs I" style="left:70px;top:870px;font-size:112px;color:${C.beige}">(resultado diferente)</div>`,

  // 6 · pergunta grande com itálico no meio
  '06_precisa_mesmo_de_um_site': `${BRAND(C.navy)}${LAB('landing pages', C.navy)}
    <div class="abs H" style="left:66px;top:300px;font-size:200px;color:${C.navy};line-height:.9">Você<br>precisa <span class="I" style="font-size:210px;color:${C.indigo}">mesmo</span><br>de um site?</div>
    ${FOOT('Sim. E a gente<br>te conta por quê.', C.navy)}${ARROW(C.navy)}`,

  // 7 · bloco de cor (índigo) só com texto
  '07_sua_visao_nosso_trabalho': `<div class="abs" style="left:0;top:0;width:1080px;height:1350px;background:${C.indigo}"></div>${GRAIN(.12)}
    ${BRAND(C.off)}${LAB('trabalhe<br>com a gente', C.off)}
    <div class="abs H" style="left:66px;top:260px;font-size:250px;color:${C.off}">Sua visão.<br>Nosso<br>trabalho.</div>
    ${FOOT('Vamos criar algo<br>que faça sentido<br>pra sua marca?', C.off)}${ARROW(C.off)}`,

  // 8 · papel texturizado + pílulas (serviços reais)
  '08_o_que_a_gente_faz': `<div class="abs" style="left:0;top:0;width:1080px;height:1350px;background:${C.beige}"></div>
    <svg class="abs" style="left:0;top:0;mix-blend-mode:multiply;opacity:.55" width="1080" height="1350"><rect width="100%" height="100%" filter="url(#paper)"/></svg>
    ${BRAND(C.navy)}${LAB('nossos<br>serviços', C.navy)}
    <div class="abs" style="left:0;right:0;top:330px;text-align:center"><span class="I" style="font-size:150px;display:block">O que a gente</span><span class="H" style="font-size:190px;display:block;margin-top:34px">faz:</span></div>
    <div class="abs" style="left:90px;right:90px;top:730px;display:flex;flex-wrap:wrap;gap:22px;justify-content:center">
      <span class="pill fill">Gestão de redes sociais</span><span class="pill line">Landing pages</span>
      <span class="pill line">Estratégia digital</span><span class="pill fill">Identidade visual</span></div>
    <div class="abs p" style="left:0;right:0;top:1090px;text-align:center;font-size:27px">A gente te ajuda a escolher<br><b>o melhor caminho pra sua marca.</b></div>`,

  // 9 · foto recortada em forma orgânica (nuvem)
  '09_estrategia_design_conteudo': `${BRAND(C.navy)}${LAB('vamos<br>conversar', C.navy)}
    <div class="abs" style="left:90px;top:150px;width:900px;height:980px;clip-path:path('${BLOB}')">${crop('tablet', 60, 120, 1000, 900, 980, 'filter:brightness(.58) contrast(1.08)')}
      </div>
    <div class="abs H" style="left:200px;top:390px;font-size:170px;color:${C.off}">Estratégia<br>Design<br>Conteúdo</div>
    <div class="abs I" style="left:206px;top:830px;font-size:150px;color:${C.off}">resultado.</div>
    ${FOOT('Hold the vision.<br>Trust the process.', C.navy)}${ARROW(C.navy)}`,
};
Object.entries(POSTS).forEach(([id, html]) => {
  const d = document.createElement('div');
  d.className = 'post slide'; d.id = id;
  d.innerHTML = html;
  document.body.appendChild(d);
});
</script>
</body>
</html>
