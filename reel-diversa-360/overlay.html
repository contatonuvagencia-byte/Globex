<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reel overlay</title>
<style>
@font-face { font-family: "Open Sauce"; src: url(fonts/OpenSauceSans-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Open Sauce"; src: url(fonts/OpenSauceSans-Medium.ttf); font-weight: 500; }
@font-face { font-family: "Open Sauce"; src: url(fonts/OpenSauceSans-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "Open Sauce"; src: url(fonts/OpenSauceSans-Bold.ttf); font-weight: 700; }
@font-face { font-family: "Script"; src: url(fonts/Yellowtail.ttf); }
@font-face { font-family: "Cinzel"; src: url(fonts/Cinzel.woff2) format("woff2"); }
:root { --wine: #8C0128; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
body { font-family: "Open Sauce", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; opacity: 0; }
.shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.35), 0 4px 22px rgba(0,0,0,0.45); }
.script { font-family: "Script", cursive; font-weight: 400; }

/* subtitles — safe zone: text block stays between y 250 and 1670 */
#sub { position: absolute; left: 70px; right: 70px; bottom: 300px; text-align: center; opacity: 1; }
#sub span { display: inline-block; font-weight: 600; font-size: 56px; line-height: 1.22; letter-spacing: -0.005em; }

/* city card */
#city { top: 300px; text-align: center; }
#city .bar { width: 64px; height: 4px; background: var(--wine); margin: 0 auto 26px; box-shadow: 0 0 18px rgba(0,0,0,0.3); }
#city .mask { overflow: hidden; }
#city .name { display: inline-block; font-weight: 700; font-size: 74px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.05; }
#city .sub { font-size: 50px; margin-top: 10px; opacity: 0.95; }

/* top seller card */
#ts { top: 290px; bottom: auto; display: flex; justify-content: center; align-items: flex-start; }
#ts .box { position: relative; background: rgba(140, 1, 40, 0.93); padding: 46px 70px 40px; text-align: center; border-radius: 6px;
  box-shadow: 0 18px 60px rgba(0,0,0,0.35); overflow: hidden; }
#ts .box::after { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(255,255,255,0.35); border-radius: 3px; }
#ts .k { font-weight: 600; font-size: 30px; letter-spacing: 0.32em; }
#ts .rule { width: 90px; height: 2px; background: rgba(255,255,255,0.7); margin: 22px auto; }
#ts .t { font-weight: 700; font-size: 66px; line-height: 1.05; }
#ts .s { font-size: 52px; margin-top: 14px; }

/* end card */
#endbg { background: linear-gradient(180deg, rgba(5,8,20,0.55) 0%, rgba(5,8,20,0.15) 45%, rgba(5,8,20,0.25) 70%, rgba(5,8,20,0.6) 100%); }
#logos { top: 330px; display: flex; flex-direction: column; align-items: center; }
#word { display: flex; align-items: flex-end; font-family: "Cinzel"; line-height: 0.8; letter-spacing: 0.02em; color: #fff; }
#word span { display: inline-block; }
#rule { height: 1.5px; background: rgba(255,255,255,0.75); margin-top: 16px; }
#tours { margin-top: 20px; width: 190px; }
#with { font-size: 46px; margin-top: 40px; opacity: 0.95; }
#div { font-weight: 700; font-size: 44px; letter-spacing: 0.24em; margin-top: 8px; }
#div2 { font-weight: 500; font-size: 22px; letter-spacing: 0.36em; margin-top: 12px; opacity: 0.85; }
#cta { top: 1040px; text-align: center; }
#cta .e { display: inline-block; font-weight: 700; font-size: 86px; letter-spacing: 0.02em; }
#cta .ul { height: 6px; background: var(--wine); margin: 8px auto 0; }
#cta .a { font-size: 72px; margin-top: 18px; }
</style>
</head>
<body>
<div class="layer" id="endbg"></div>
<div class="layer" id="city"><div class="bar"></div><div class="mask"><span class="name shadow"></span></div><div class="script sub shadow"></div></div>
<div class="layer" id="ts"><div class="box">
  <div class="k">AGÊNCIA TOP SELLER</div><div class="rule"></div>
  <div class="t">Diversa Turismo 360°</div><div class="script s">USA Edition 2026</div>
</div></div>
<div class="layer" id="logos">
  <div id="word" class="shadow"></div>
  <div id="rule"></div>
  <svg id="tours" viewBox="0 0 686.92 152.69"><path fill="#ffffff" d="M19.31 55.52H0V43.07H19.31V0H33.66V43.07H54.71V55.52H33.66v92.57H19.31Zm157.25 83.56c11.52 0 21.29-4.16 29.29-12.48s12-18.51 12-30.59c0-12.24-4-22.46-11.96-30.75s-17.74-12.44-29.33-12.44c-11.52 0-21.25 4.16-29.21 12.44S135.4 83.76 135.4 96c0 12.08 4 22.26 11.96 30.59s17.7 12.48 29.21 12.48Zm-.48 13.62c-7.47 0-14.67-1.49-21.54-4.44s-13.09-7.19-18.71-12.73c-5.290-5.21-9.29-11.19-12.04-17.98-2.79-6.79-4.16-14.06-4.16-21.78 0-7.64 1.41-14.91 4.24-21.78 2.87-6.87 6.91-12.93 12.2-18.22 5.37-5.37 11.47-9.45 18.34-12.32 6.87-2.83 14.1-4.24 21.66-4.24 7.76 0 15.11 1.41 22.1 4.24 6.95 2.87 13.17 6.95 18.63 12.32s9.62 11.47 12.48 18.34 4.32 14.1 4.32 21.66c0 7.6-1.41 14.79-4.24 21.62-2.87 6.83-6.95 12.85-12.32 18.14-5.54 5.54-11.84 9.78-18.87 12.73-7.07 2.95-14.42 4.44-22.1 4.44ZM330.27 43.07V95.52c0 15.92 2.26 27.19 6.83 33.74 4.53 6.55 12.2 9.82 23.03 9.82 10.71 0 18.42-3.31 23.07-9.94s6.99-17.86 6.99-33.62V43.07h14.42v59.88c0 16.36-3.76 28.73-11.23 37.13-7.52 8.4-18.51 12.61-33.05 12.61-14.59 0-25.66-4.2-33.25-12.61-7.56-8.4-11.35-20.77-11.35-37.13V43.07ZM510.03 64.16c5.37-9.09 10.63-15.52 15.8-19.27 5.17-3.8 11.19-5.7 18.06-5.7 2.06 0 4.12.2 6.22.61 2.1.36 4.16.93 6.22 1.62L551.6 55.15c-1.58-.48-3.23-.85-4.93-1.17s-3.31-.49-4.89-.49c-8.77 0-16.28 4.12-22.46 12.32s-9.29 18.42-9.29 30.67v51.6H495.48V43.07h14.55Zm101.94 65.17l13.86-7.92c2.3 5.86 5.62 10.26 9.94 13.21 4.36 2.95 9.66 4.44 16 4.44 6.14 0 11.03-1.58 14.67-4.69s5.45-7.27 5.45-12.48c0-8.04-7.15-14.87-21.41-20.49-1.54-.53-2.71-1.01-3.56-1.41-11.07-4.32-18.79-8.81-23.23-13.41-4.4-4.61-6.63-10.34-6.63-17.09 0-8.93 3.15-16.24 9.5-21.98 6.3-5.7 14.46-8.57 24.48-8.57 8.53 0 15.8 1.86 21.82 5.58 5.98 3.72 10.38 8.97 13.13 15.84l-13.37 7.47c-1.66-4.97-4.44-8.77-8.32-11.35-3.84-2.63-8.57-3.92-14.18-3.92-5.05 0-9.21 1.49-12.48 4.44s-4.93 6.63-4.93 11.07c0 4.32 1.62 7.92 4.85 10.75s9.94 5.98 20.12 9.33c11.56 4.04 19.27 8.4 23.27 13.17 4 4.73 5.98 11.27 5.98 19.64 0 9.62-3.43 17.33-10.3 23.07-6.87 5.78-16.08 8.65-27.72 8.65-8.89 0-16.57-2.02-23.03-6.1-6.42-4.08-11.07-9.82-13.9-17.25"/></svg>
  <div id="with" class="script shadow">em parceria com</div>
  <div id="div" class="shadow">DIVERSA TURISMO</div>
  <div id="div2" class="shadow">360° · USA EDITION 2026</div>
</div>
<div class="layer" id="cta"><span class="e shadow">Embarque 15/11</span><div class="ul"></div><div class="script a shadow">Acompanhe a viagem</div></div>
<div id="sub"><span class="shadow"></span></div>

<script>
const TL = window.TIMELINE;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (p) => 1 - Math.pow(1 - p, 3);
const eOut5 = (p) => 1 - Math.pow(1 - p, 5);
const $ = (s) => document.querySelector(s);

// CarlAVieira wordmark (white), same construction as the brand logo
const word = $('#word');
const base = 64;
[...'CARL'].map((c) => [c, 1]).concat([['A', 1.42, -0.02], ['V', 1.42, -0.36]], [...'IEIRA'].map((c) => [c, 1]))
  .forEach(([c, s, ml]) => { const e = document.createElement('span'); e.textContent = c; e.style.fontSize = base * s + 'px'; if (ml) e.style.marginLeft = ml + 'em'; word.appendChild(e); });
const glyphs = [...word.children];

const sub = $('#sub span');
const city = $('#city'), cityName = $('#city .name'), citySub = $('#city .sub'), cityBar = $('#city .bar');
const ts = $('#ts'), tsBox = $('#ts .box');
const endbg = $('#endbg'), logos = $('#logos'), cta = $('#cta');

window.renderFrame = (t) => {
  // subtitles
  const s = TL.subs.find((x) => t >= x.t0 && t < x.t1);
  if (s) {
    if (sub.textContent !== s.text) sub.textContent = s.text;
    const p = eOut(prog(t, s.t0, s.t0 + 0.16));
    const o = Math.min(p, 1 - prog(t, s.t1 - 0.1, s.t1));
    sub.style.opacity = o;
    sub.style.transform = `translateY(${(1 - p) * 10}px)`;
  } else sub.style.opacity = 0;

  // city cards
  const c = TL.cities.find((x) => t >= x.t0 && t < x.t1);
  if (c) {
    cityName.textContent = c.name;
    citySub.textContent = c.sub;
    const p = eOut5(prog(t, c.t0 + 0.05, c.t0 + 0.45));
    city.style.opacity = 1 - prog(t, c.t1 - 0.15, c.t1);
    cityBar.style.transform = `scaleX(${eOut(prog(t, c.t0, c.t0 + 0.35))})`;
    cityName.style.transform = `translateY(${(1 - p) * 105}%)`;
    citySub.style.opacity = eOut(prog(t, c.t0 + 0.2, c.t0 + 0.5));
  } else city.style.opacity = 0;

  // Top Seller card
  const k = TL.topseller;
  if (t >= k.t0 && t < k.t1) {
    const p = eOut5(prog(t, k.t0, k.t0 + 0.6));
    ts.style.opacity = clamp(p * 1.5) * (1 - prog(t, k.t1 - 0.3, k.t1));
    tsBox.style.transform = `scale(${0.9 + 0.1 * p})`;
    tsBox.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`;
    [...tsBox.children].forEach((e, i) => { e.style.opacity = eOut(prog(t, k.t0 + 0.3 + i * 0.1, k.t0 + 0.7 + i * 0.1)); });
  } else ts.style.opacity = 0;

  // end card
  const e0 = TL.end.t0;
  if (t >= e0) {
    endbg.style.opacity = eOut(prog(t, e0, e0 + 1.0));
    logos.style.opacity = 1;
    glyphs.forEach((g, i) => {
      const p = eOut5(prog(t, e0 + 0.3 + i * 0.04, e0 + 1.2 + i * 0.04));
      g.style.opacity = p; g.style.transform = `translateY(${(1 - p) * 0.4}em)`; g.style.filter = `blur(${(1 - p) * 5}px)`;
    });
    $('#rule').style.width = word.getBoundingClientRect().width * eOut(prog(t, e0 + 0.9, e0 + 1.6)) + 'px';
    $('#tours').style.opacity = eOut(prog(t, e0 + 1.2, e0 + 1.8));
    ['#with', '#div', '#div2'].forEach((q, i) => {
      const p = eOut(prog(t, e0 + 1.8 + i * 0.2, e0 + 2.5 + i * 0.2));
      $(q).style.opacity = p; $(q).style.transform = `translateY(${(1 - p) * 14}px)`;
    });
    const cp = eOut5(prog(t, e0 + 3.0, e0 + 3.7));
    cta.style.opacity = clamp(cp * 1.4);
    $('#cta .e').style.transform = `translateY(${(1 - cp) * 24}px)`;
    $('#cta .ul').style.width = 300 * eOut(prog(t, e0 + 3.3, e0 + 4.0)) + 'px';
    $('#cta .a').style.opacity = eOut(prog(t, e0 + 3.8, e0 + 4.5));
    // everything fades with the picture at the very end
    const out = prog(t, TL.duration - 0.6, TL.duration);
    [endbg, logos, cta].forEach((el) => { el.style.opacity = Math.min(+el.style.opacity || 1, 1 - out); });
  } else { endbg.style.opacity = 0; logos.style.opacity = 0; cta.style.opacity = 0; }
};
</script>
</body>
</html>
