<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
body{font-family:I,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}

#s.glow{background:

.top{position:absolute;left:90px;right:90px;top:260px;display:flex;justify-content:space-between;align-items:center}
.top img{height:96px}
.top span{font-weight:800;font-size:26px;letter-spacing:.18em;opacity:.6}
.kick{position:absolute;left:90px;right:90px;display:flex;align-items:center;gap:22px;font-weight:800;font-size:30px;letter-spacing:.2em;color:var(--l);text-transform:uppercase}
.dark .kick,.orange .kick{color:var(--p)}
.kick:before{content:"";width:60px;height:5px;background:var(--l2);border-radius:3px}
.orange .kick:before{background:#fff}
.h{position:absolute;left:90px;right:90px;font-weight:900;letter-spacing:-.045em;line-height:1}
.h em{font-style:normal;color:var(--l2)}
.orange .h em{color:var(--t)}
.orange .strike:after{background:var(--t)}
.mk{background:var(--l2);color:#fff;padding:0 .12em;border-radius:.08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.strike{position:relative;white-space:nowrap}
.strike:after{content:"";position:absolute;left:-6px;right:-6px;top:44%;height:12px;background:var(--l2);border-radius:6px;transform:rotate(-2deg)}
.p{position:absolute;left:90px;right:90px;font-weight:500;font-size:42px;line-height:1.36;color:var(--g)}
.dark .p,.orange .p{color:rgba(255,255,255,.85)}
.big{position:absolute;left:90px;font-weight:900;letter-spacing:-.06em;line-height:.9;color:var(--l2)}
.card{position:absolute;overflow:hidden;border-radius:36px;box-shadow:0 30px 70px rgba(0,0,0,.22)}

.list{position:absolute;left:90px;right:90px}
.row{display:flex;align-items:center;gap:28px;background:#fff;border:3px solid #f1e6e0;border-left:14px solid var(--l2);border-radius:24px;padding:26px 32px;margin-bottom:24px;font-weight:800;font-size:42px;line-height:1.15;color:var(--t);box-shadow:0 10px 30px rgba(0,0,0,.06)}
.row b{flex:none;display:flex;width:70px;height:70px;border-radius:50%;background:var(--l2);color:#fff;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.row small{display:block;font-weight:500;font-size:30px;color:var(--g);margin-top:6px;line-height:1.3}
.btn{position:absolute;left:90px;display:inline-flex;align-items:center;gap:26px;background:var(--t);color:#fff;font-weight:800;font-size:38px;letter-spacing:.1em;padding:36px 52px;border-radius:999px;text-transform:uppercase}
.btn i{font-style:normal;display:inline-flex;width:58px;height:58px;border-radius:50%;background:var(--l2);align-items:center;justify-content:center;font-size:32px;letter-spacing:0}
.orange .btn{background:#fff;color:var(--l)}
.foot{position:absolute;left:90px;right:90px;top:1520px;display:flex;justify-content:space-between;font-weight:700;font-size:26px;letter-spacing:.1em;opacity:.55}
.flag{position:absolute;width:300px;height:200px;border-radius:26px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18);border:8px solid #fff}
.flag svg{width:100%;height:100%;display:block}
.chip{display:inline-block;background:var(--p2);color:var(--l);font-weight:800;font-size:32px;padding:14px 26px;border-radius:14px;margin:0 14px 16px 0}
.note{position:absolute;left:90px;right:90px;font-weight:600;font-size:24px;line-height:1.35;opacity:.6}
.news{position:absolute;left:90px;right:90px;background:#fff;color:#111;border-radius:28px;padding:50px 54px;box-shadow:0 30px 70px rgba(0,0,0,.18)}
.news small{display:block;font-weight:800;font-size:28px;letter-spacing:.1em;color:#888;margin-bottom:22px}
.news p{font-family:Georgia,'DejaVu Serif',serif;font-weight:700;font-size:66px;line-height:1.1}
/* capas */
#s.cover{background:#fff;display:flex;align-items:center;justify-content:center}
.cover .ring{width:620px;height:620px;border-radius:50%;background:radial-gradient(circle at 70% 25%,#fff 0%,var(--p2) 55%,var(--p) 100%);display:flex;align-items:center;justify-content:center}
.cover svg{width:330px;height:330px;fill:none;stroke:var(--l2);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.cover .txt{font-weight:900;font-size:170px;letter-spacing:-.06em;color:var(--l2)}
