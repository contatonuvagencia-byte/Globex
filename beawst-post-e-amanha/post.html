<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post É Amanhã</title>
<!-- Estático "É amanhã" (1080x1350, 4:5). Gerar: node render.mjs -->
<script>
const INFO = { data: '07/11', hora: '8h', formato: 'online e gratuita' };   // troque a hora aqui se mudar
</script>
<style>
@font-face{font-family:M;font-weight:700;src:url(assets/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(assets/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(assets/montserrat-latin-900-normal.woff2)}
:root{--roxo:#5B00D6;--magenta:#A3127F;--vermelho:#F0102A;--escuro:#0E0716;
  --gradL:linear-gradient(90deg,#B98CFF 0%,#FF6BB5 50%,#FF6B6B 100%)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--escuro)}
body{font-family:M,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;position:relative}
.abs{position:absolute}
.glow{position:absolute;border-radius:50%;filter:blur(140px)}
.gradL{background:var(--gradL);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.12)}
.chip{display:inline-flex;align-items:center;gap:16px;font-weight:800;font-size:40px;padding:20px 34px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22)}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--gradL)}
.foot{display:flex;align-items:center;gap:26px;background:#fff;color:#0B0B0F;border-radius:32px;padding:22px 30px 22px 22px}
.circ{flex:none;width:120px;height:120px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 5px #B98CFF}
.circ img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;transform:scale(1.45);transform-origin:50% 30%}
</style>
</head>
<body>
  <div class="glow" style="width:1000px;height:1000px;background:var(--roxo);opacity:.75;left:-300px;top:-300px"></div>
  <div class="glow" style="width:900px;height:900px;background:var(--vermelho);opacity:.4;left:500px;top:700px"></div>
  <div class="glow" style="width:600px;height:600px;background:var(--magenta);opacity:.4;left:600px;top:-100px"></div>
  <!-- anéis de "contagem" saindo do título -->
  <div class="ring" style="left:-260px;top:-60px;width:1100px;height:1100px"></div>
  <div class="ring" style="left:-130px;top:70px;width:840px;height:840px;border-color:rgba(255,255,255,.18)"></div>

  <div class="abs" style="left:90px;top:84px"><img src="assets/logo-feira-branco.svg" style="width:330px;display:block"></div>
  <div class="abs" style="right:90px;top:96px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px;letter-spacing:.16em">
    <span style="width:18px;height:18px;border-radius:50%;background:var(--vermelho);box-shadow:0 0 0 7px rgba(240,16,42,.28)"></span>CONTAGEM FINAL</div>

  <div class="abs" style="left:84px;top:250px;font-weight:900;font-size:190px;line-height:.9;letter-spacing:-.045em">É</div>
  <div class="abs gradL" style="left:80px;top:430px;font-weight:900;font-size:178px;line-height:.9;letter-spacing:-.045em;white-space:nowrap">AMANHÃ.</div>
  <div class="abs" style="left:90px;top:680px;font-weight:900;font-size:66px;letter-spacing:-.01em">Beawst Global Connect</div>

  <div class="abs" id="infos" style="left:90px;right:90px;top:810px;display:flex;flex-wrap:wrap;gap:16px"></div>

  <div class="abs" style="left:90px;right:90px;top:1060px;display:flex;gap:20px">
    <div class="foot" style="flex:1.05"><div class="circ"><img src="assets/apresentadora.jpg"></div>
      <div><div style="font-weight:700;font-size:26px;color:#5A5466">com</div><div style="font-weight:900;font-size:38px;line-height:1.05">Samanta Lopes</div></div></div>
    <div class="foot" style="flex:1;background:linear-gradient(135deg,#5B00D6,#A3127F 55%,#F0102A);color:#fff;padding-left:12px">
      <img src="assets/mala.png" style="width:130px;height:130px;flex:none;margin:-14px -6px">
      <div style="font-weight:900;font-size:32px;line-height:1.1">prêmios pra quem estiver ao vivo</div></div>
  </div>
<script>
document.getElementById('infos').innerHTML = [INFO.data, INFO.hora, INFO.formato].map(t => `<span class="chip"><i></i>${t}</span>`).join('');
</script>
</body>
</html>
