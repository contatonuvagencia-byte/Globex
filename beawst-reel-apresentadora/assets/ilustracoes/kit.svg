<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="800" viewBox="0 0 800 800">
  <!-- Kit viajante: travesseiro de pescoço + garrafinha térmica, com o logo da feira estampado -->
  <defs>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="fino"><feGaussianBlur stdDeviation="2.5"/></filter>
    <linearGradient id="corpo" x1="0" x2="1">
      <stop offset="0" stop-color="#C4C0CD"/><stop offset=".16" stop-color="#EDECF2"/><stop offset=".3" stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#F1F0F5"/><stop offset=".86" stop-color="#D6D2DE"/><stop offset="1" stop-color="#B9B4C3"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" x2="1">
      <stop offset="0" stop-color="#1E1E26"/><stop offset=".3" stop-color="#5A5A6C"/><stop offset=".55" stop-color="#2C2C36"/><stop offset="1" stop-color="#15151B"/>
    </linearGradient>
    <linearGradient id="pressao" x1="0" x2="1"><stop offset="0" stop-color="#8E9AB8"/><stop offset=".5" stop-color="#E6EBF5"/><stop offset="1" stop-color="#7A86A3"/></linearGradient>
  </defs>

  <!-- sombras no chão -->
  <ellipse cx="300" cy="676" rx="230" ry="30" fill="#000" opacity=".45" filter="url(#sombra)"/>
  <ellipse cx="572" cy="722" rx="92" ry="16" fill="#000" opacity=".5" filter="url(#sombra)"/>

  <!-- travesseiro de pescoço (veludo azul) -->
  <g stroke-linecap="round" fill="none">
    <path d="M190 590 C 110 470, 150 300, 300 292 C 450 300, 490 470, 410 590" stroke="#132B5E" stroke-width="156"/>
    <path d="M190 590 C 110 470, 150 300, 300 292 C 450 300, 490 470, 410 590" stroke="#1F4594" stroke-width="140"/>
    <path d="M190 590 C 110 470, 150 300, 300 292 C 450 300, 490 470, 410 590" stroke="#2A57AE" stroke-width="104" transform="translate(-4 -6)"/>
    <path d="M178 560 C 118 460, 160 318, 300 312" stroke="#7FA6E8" stroke-width="34" opacity=".45" filter="url(#suave)"/>
    <path d="M300 312 C 400 318, 440 400, 432 470" stroke="#7FA6E8" stroke-width="18" opacity=".25" filter="url(#suave)"/>
    <!-- costura -->
    <path d="M190 590 C 110 470, 150 300, 300 292 C 450 300, 490 470, 410 590" stroke="#BFD2F5" stroke-width="3" stroke-dasharray="2 13" opacity=".55"/>
    <!-- sombra interna do vão -->
    <path d="M232 580 C 180 480, 210 372, 300 368 C 390 372, 420 480, 368 580" stroke="#0E2149" stroke-width="10" opacity=".55" filter="url(#fino)"/>
  </g>
  <!-- alça com botão de pressão entre as pontas -->
  <rect x="236" y="604" width="128" height="38" rx="16" fill="#163470"/>
  <rect x="236" y="604" width="128" height="10" rx="5" fill="#3B66BC" opacity=".5"/>
  <circle cx="300" cy="623" r="12" fill="url(#pressao)"/><circle cx="300" cy="623" r="5" fill="#5C6884"/>
  <!-- logo estampado (branco) no alto do arco -->
  <image href="../logo-feira-branco.svg" x="200" y="258" width="200" height="61" opacity=".96"/>

  <!-- garrafinha térmica -->
  <g>
    <rect x="502" y="244" width="140" height="474" rx="34" fill="url(#corpo)"/>
    <rect x="502" y="690" width="140" height="28" rx="14" fill="#000" opacity=".08"/>
    <rect x="506" y="132" width="132" height="112" rx="30" fill="url(#corpo)"/>
    <rect x="506" y="132" width="132" height="28" rx="14" fill="#fff" opacity=".7"/>
    <rect x="502" y="234" width="140" height="18" rx="4" fill="url(#anel)"/>
    <rect x="519" y="270" width="12" height="400" rx="6" fill="#fff" opacity=".95" filter="url(#fino)"/>
    <rect x="624" y="270" width="8" height="400" rx="4" fill="#9C97A8" opacity=".35" filter="url(#fino)"/>
    <!-- logo estampado (cor): coruja em cima, nome embaixo -->
    <svg x="528" y="330" width="87" height="137" viewBox="0 0 395 624"><image href="../logo-feira-cor.svg" width="2040" height="624"/></svg>
    <svg x="510" y="482" width="124" height="48" viewBox="440 0 1600 624"><image href="../logo-feira-cor.svg" width="2040" height="624"/></svg>
  </g>
</svg>
