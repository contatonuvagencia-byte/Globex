<script>
/* =====================================================================
   CONFIGURAÇÃO — troque nome, prêmio, data, cores e tempos aqui.
   Depois rode:  node render.mjs
   ===================================================================== */
const CONFIG = {
  apresentadora: 'Samanta Lopes',
  cargo: 'apresentadora oficial',
  credencial: 'educadora e empreendedora | +25 anos de mercado',
  data: '07/11',
  horario: 'a partir das 8h30',

  gancho: ['Adivinha quem vai comandar', 'a Beawst Global Connect?'],
  contexto: ['escolas e especialistas', 'em estudo e trabalho no exterior'],  // [] para tirar
  // cena 4: frases no centro, uma por vez, no ritmo da música (duração em batidas; 120 BPM = 0,5s por batida)

  //   { bandeiras: ['irlanda', 'malta'] }                      bandeiras desenhadas (irlanda, malta)

  frases: [
    { texto: 'Quer estudar e <span class="grad">trabalhar fora?</span>', batidas: 4 },
    { texto: 'Na feira, <span class="grad">escolas internacionais</span> ao vivo', batidas: 4 },
    { texto: 'Estudar e trabalhar na <span class="grad">Irlanda</span> e em <span class="grad">Malta</span>', batidas: 5, midia: { bandeiras: ['irlanda', 'malta'] } },
    { texto: '<b>Gateway School</b>, direto de Malta', batidas: 5, midia: { logo: 'assets/parceiros/01-gateway-school.jpg', fundo: '#FFFFFF' } },
    { texto: 'Dúvidas de visto e passaporte com o <b>Mundo dos Vistos</b>', batidas: 5, midia: { logo: 'assets/parceiros/02-mundo-dos-vistos.jpg', fundo: '#000000' } },
    { texto: 'Visto, custo e destino: <span class="grad">tudo explicado ao vivo</span>', batidas: 5 },
  ],
  ctaTitulo: ['Garante', 'sua vaga'],
  cta: 'Link na bio',
  ctaInfo: '07/11 · a partir das 8h30 · online e gratuito',            // '' para tirar

  // Legendas: só aparecem se existir assets/locucao.mp3 (ajuste os tempos à locução)
  legendas: [
    { start: 0.0,  end: 3.0,  text: 'Sabe quem vai apresentar a feira de intercâmbio que você não pode perder?' },
    { start: 3.0,  end: 8.0,  text: 'Ela mesma: Samanta Lopes. Educadora, empreendedora e mais de 25 anos conectando pessoas, inovação e aprendizagem.' },
    { start: 8.0,  end: 15.0, text: 'Dia 7 de novembro, a partir das 8h30, online e de graça. Escolas e especialistas em estudo e trabalho no exterior, e você assiste de casa.' },
    { start: 15.0, end: 18.0, text: 'Quer estudar e trabalhar fora?' },
    { start: 18.0, end: 20.0, text: 'Na feira, você encontra escolas internacionais ao vivo,' },
    { start: 20.0, end: 22.5, text: 'opções pra estudar e trabalhar na Irlanda e em Malta,' },
    { start: 22.5, end: 25.0, text: 'a Gateway School, direto de Malta,' },
    { start: 25.0, end: 27.5, text: 'e o Mundo dos Vistos pra tirar suas dúvidas de visto e passaporte.' },
    { start: 27.5, end: 30.0, text: 'Visto, custo e destino: a gente explica tudo ao vivo.' },
    { start: 30.0, end: 35.6, text: 'E tem presentes exclusivos: um kit viajante Beawst sorteado de hora em hora.' },
    { start: 35.6, end: 40.0, text: 'E uma mala de viagem Beawst pra quem ficar até o fim.' },
    { start: 40.0, end: 43.0, text: 'Garante sua vaga no link da bio. É de graça.' },
  ],

  CORES: {
    principal: '#5B00D6',     // roxo da feira
    magenta: '#A3127F',
    vermelho: '#F0102A',
    gradiente: 'linear-gradient(90deg, #5B00D6 0%, #A3127F 50%, #F0102A 100%)',
    gradienteClaro: 'linear-gradient(90deg, #B98CFF 0%, #FF6BB5 50%, #FF6B6B 100%)',  // para fundo escuro
    texto: '#0B0B0F',
    fundoClaro: '#FFFFFF',
    fundoEscuro: '#0E0716',
    card: '#F7F5F9', cardBorda: '#ECE8F0',
  },

  ASSETS: {
    fotoApresentadora: 'assets/apresentadora.jpg',
    videoApresentadora: 'assets/apresentadora.mp4',   // se existir, substitui a foto nas cenas 1 e 2
    logoFeira: 'assets/logo-feira.png',
    logoBeawst: 'assets/logo-feira.png',            // rodapé da cena final
    parceirosPlaceholder: 9,                          // quantos quadros vazios mostrar se a pasta parceiros/ estiver vazia
  },

  // Presentes (cena 5). Usa assets/kit.png e assets/mala.png se existirem; senão as ilustrações
  // geradas de assets/ilustracoes/*.svg (com o logo da feira aplicado; ver LOGO_PREMIOS no render.mjs).
  PREMIOS: {
    titulo: ['Presentes <span class="gradL">exclusivos</span>', 'pra você'],
    tituloSozinho: 1.8,                               // segundos com o título sozinho na tela
    kit:  { imagem: 'assets/kit.png',  texto: ['Kit viajante Beawst:', '<span class="gradL">sorteado de hora em hora</span>'] },
    mala: { imagem: 'assets/mala.png', texto: ['<span class="gradL">Mala de viagem Beawst</span>', 'pra quem ficar até o fim'] },
    malaEntraEm: 5.6,                                 // segundos depois do início da cena
  },

  WIDTH: 1080, HEIGHT: 1920, FPS: 30,
  DURATION: 43,                                       // segundos (máx. 60)
  SAFE: { top: 250, bottom: 340, side: 80 },

  // início de cada cena em segundos (cortes no tempo da música: 120 BPM = 0,5s por batida)
  CENAS: { gancho: 0, revelacao: 3, contexto: 8, parceiros: 15, premio: 30, cta: 40 },
  QUADRO_CAPA: 7.2,                                   // segundo usado para gerar a capa
  BPM: 120,
};
</script>
<style>
@font-face{font-family:M;font-weight:500;src:url(assets/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(assets/montserrat-latin-700-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#000}
body{font-family:M,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#000}
.scene{position:absolute;inset:0;display:none;overflow:hidden}

.center div{text-wrap:balance}
.grad{background:var(--gradiente);-webkit-background-clip:text;background-clip:text;color:transparent}
.gradL{background:var(--gradienteClaro);-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block;white-space:pre}
.glow{position:absolute;border-radius:50%;filter:blur(130px)}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;border:4px dashed currentColor;border-radius:24px;
  font-weight:700;font-size:26px;letter-spacing:.02em;padding:16px;opacity:.85;background:rgba(127,127,127,.12)}
.logoCard{background:#fff;border-radius:28px;padding:26px 40px;display:inline-block}
/* cena 1/2 */
#bg{position:absolute;inset:0;overflow:hidden}
#bg img,#bg video{position:absolute;left:50%;top:50%;transform-origin:50% 35%}
#shade{position:absolute;left:0;right:0;bottom:0;height:1100px;background:linear-gradient(180deg,rgba(14,7,22,0) 0%,rgba(14,7,22,.75) 55%,rgba(14,7,22,.92) 100%)}
.hook{font-weight:900;font-size:96px;line-height:1.08;color:#fff;letter-spacing:-.01em}
.ulbar{height:12px;border-radius:8px;background:var(--gradiente);transform-origin:left;margin:22px auto 0}
.name{font-weight:900;font-size:176px;line-height:.92;color:#fff;letter-spacing:-.025em;white-space:nowrap}
.badge{display:inline-block;font-weight:800;font-size:32px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--principal);
  padding:16px 28px;border-radius:999px}
.cred{font-weight:700;font-size:38px;line-height:1.3;color:rgba(255,255,255,.92)}
/* cena 3 */
.date{font-weight:900;font-size:400px;line-height:.9;color:#fff;letter-spacing:-.05em;white-space:nowrap}
.mask{overflow:hidden;padding-bottom:.05em}
.mask>span{display:inline-block}
.infos{font-weight:800;font-size:76px;color:#fff}
.ctx{font-weight:600;font-size:42px;line-height:1.35;color:rgba(255,255,255,.82)}
/* cena 4 */
.tile{position:absolute;background:#fff;border:3px solid var(--cardBorda);border-radius:28px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile img{max-width:78%;max-height:70%;object-fit:contain}
.tile .ph{position:absolute;inset:14px;font-size:22px;color:#9A94A5;border-width:3px}
.word{font-weight:900;font-size:240px;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.close{font-weight:900;font-size:104px;line-height:1.02;letter-spacing:-.02em;color:var(--texto)}
.phrase{font-weight:900;font-size:96px;line-height:1.04;letter-spacing:-.02em;color:var(--texto)}
.phrase b{font-weight:900;color:var(--principal)}
.mlogo{display:inline-flex;align-items:center;justify-content:center;width:560px;height:230px;border-radius:30px;box-shadow:0 18px 40px rgba(14,7,22,.18);border:3px solid #ECE8F0}
.mlogo img{max-width:82%;max-height:78%;object-fit:contain}
.flag{display:inline-block;margin:0 14px;width:300px;height:200px;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(14,7,22,.18),0 0 0 3px #fff}
.flag svg{display:block;width:100%;height:100%}
.ptitle{font-weight:900;font-size:120px;line-height:1.02;letter-spacing:-.02em;color:#fff}
/* cena 5 */
.prizeIntro{font-weight:800;font-size:58px;color:#fff;line-height:1.2}
.prizeBox{position:absolute;left:50%;width:600px;height:600px;margin-left:-300px;display:flex;align-items:center;justify-content:center}
.prizeBox img{max-width:100%;max-height:100%;object-fit:contain}
.prizeBox .ph{width:100%;height:100%;color:rgba(255,255,255,.7);font-size:30px}
.prize{font-weight:900;font-size:96px;line-height:1.02;color:#fff;letter-spacing:-.02em}
/* cena 6 */
.ctaT{font-weight:900;font-size:176px;line-height:.95;color:#fff;letter-spacing:-.03em}
.ctaL{font-weight:800;font-size:64px;color:#fff}
.ctaI{font-weight:700;font-size:38px;color:rgba(255,255,255,.85);letter-spacing:.02em}
#caption{position:absolute;z-index:20;text-align:center;font-weight:800;font-size:40px;line-height:1.25;color:#fff;
  background:rgba(14,7,22,.78);padding:14px 26px;border-radius:18px;display:none}
</style>

<body>

  <div class="scene" id="s3">

    <div class="glow" id="g32" style="width:800px;height:800px;background:var(--vermelho);opacity:.35"></div>
    <div class="abs center" id="s3logo" style="top:290px"></div>
    <div class="abs center mask" id="s3date" style="top:640px"></div>
    <div class="abs center infos" id="s3hora" style="top:1030px"></div>
    <div class="abs center" id="s3infos" style="top:1135px"></div>

  </div>

  <div class="scene" id="s4" style="background:var(--fundoClaro)">
    <div class="glow" id="g41" style="width:800px;height:800px;background:var(--principal);opacity:.10"></div>
    <div class="glow" id="g42" style="width:800px;height:800px;background:var(--vermelho);opacity:.08"></div>
    <div id="grid"></div>
    <div class="abs center" id="s4flag" style="top:0"></div>
    <div class="abs center" id="s4word" style="top:770px;padding:0 80px"></div>
  </div>

  <div class="scene" id="s5" style="background:var(--fundoEscuro)">
    <div class="glow" id="g51" style="width:900px;height:900px;background:var(--principal);opacity:.55"></div>
    <div class="glow" id="g52" style="width:800px;height:800px;background:var(--vermelho);opacity:.35"></div>
    <div class="glow" id="malaGlow" style="width:760px;height:760px;left:160px;top:410px;background:radial-gradient(circle,#A3127F 0%,#5B00D6 45%,transparent 70%);filter:blur(40px);opacity:0"></div>
    <div class="abs center ptitle" id="s5title" style="top:0;padding:0 80px"></div>
    <div class="prizeBox" id="kitBox" style="top:420px;width:660px;height:660px;margin-left:-330px;opacity:0"></div>
    <div class="abs center prize" id="kitTxt" style="top:1110px;padding:0 60px;font-size:76px"></div>
    <div class="prizeBox" id="malaBox" style="top:410px;width:760px;height:760px;margin-left:-380px;opacity:0"></div>
    <div class="abs center prize" id="malaTxt" style="top:1200px;padding:0 50px;font-size:74px"></div>
  </div>

  <div class="scene" id="s6">
    <div class="glow" id="g61" style="width:900px;height:900px;background:var(--magenta);opacity:.5"></div>
    <div class="glow" id="g62" style="width:800px;height:800px;background:var(--vermelho);opacity:.3"></div>
    <div class="abs center ctaT" id="s6t" style="top:520px"></div>
    <div class="abs center" id="s6l" style="top:960px"></div>
    <div class="abs center ctaI" id="s6i" style="top:1250px"></div>
    <div class="abs center" id="s6logo" style="top:1350px"></div>
  </div>

  <div id="caption"></div>
</div>

<script>
const C = CONFIG, K = C.CORES, T = C.CENAS, W = C.WIDTH, H = C.HEIGHT, S = C.SAFE;
const M = window.MANIFEST || {};      // preenchido pelo render.mjs (parceiros, locução)
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eOut4 = x => 1 - Math.pow(1 - x, 4);
const eBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);
const css = (el, o) => Object.assign(el.style, o);
const order = ['gancho', 'revelacao', 'contexto', 'parceiros', 'premio', 'cta'];
const endOf = k => { const i = order.indexOf(k); return i < order.length - 1 ? T[order[i + 1]] : C.DURATION; };

const root = document.documentElement.style;
for (const k in K) root.setProperty('--' + k, K[k]);
const stage = $('stage');
css(stage, { width: W + 'px', height: H + 'px' }); css(document.body, { width: W + 'px', height: H + 'px' });
['s3', 's6'].forEach(id => $(id).style.background = K.principal);

// ---------- assets com placeholder visível quando faltam ----------
const placeholder = (file, extra = '') => `<div class="ph" ${extra}>FALTA<br>${file}</div>`;
function loadImg(src) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}
function loadVideo(src) {
  return new Promise(res => {
    const v = document.createElement('video');
    v.muted = true; v.preload = 'auto'; v.playsInline = true;
    v.onloadeddata = () => res(v); v.onerror = () => res(null); v.src = src;
    setTimeout(() => res(null), 4000);
  });
}

// palavras que entram uma a uma
const words = (lines, cls = '') => lines.map(l => `<div>${l.split(' ').map(w => `<span class="w ${cls}">${w} </span>`).join('')}</div>`).join('');

let bgMedia = null, bgIsVideo = false, partners = [];
async function build() {
  await Promise.all([500, 700, 800, 900].map(w => document.fonts.load(`${w} 100px M`, 'ÁÇãéÊ')));
  // fundo: vídeo (se existir) ou foto
  const v = M.video === false ? null : await loadVideo(C.ASSETS.videoApresentadora);
  if (v) { bgMedia = v; bgIsVideo = true; }
  else bgMedia = await loadImg(C.ASSETS.fotoApresentadora);
  if (bgMedia) {
    const mw = bgIsVideo ? bgMedia.videoWidth : bgMedia.naturalWidth, mh = bgIsVideo ? bgMedia.videoHeight : bgMedia.naturalHeight;
    const s = Math.max(W / mw, H / mh);
    css(bgMedia, { width: mw * s + 'px', height: mh * s + 'px', marginLeft: -mw * s / 2 + 'px', marginTop: -mh * s / 2 + 'px' });
    $('bg').appendChild(bgMedia);
  } else $('bg').innerHTML = `<div style="position:absolute;inset:300px 120px;color:#fff">${placeholder('apresentadora.jpg / .mp4', 'style="height:100%"')}</div>`;

  // cena 1
  $('hookBox').innerHTML = words(C.gancho, 'hook') + '<div class="ulbar" id="hookUl" style="width:560px"></div>';
  // cena 2
  const nm = C.apresentadora.split(' ');
  $('nameBox').innerHTML = `<div class="name" id="nm1">${nm[0]}</div><div class="name" id="nm2">${nm.slice(1).join(' ')}</div>
    <div style="margin-top:34px"><span class="badge" id="cargo">${C.cargo}</span></div>
    <div class="cred" id="cred" style="margin-top:26px">${C.credencial.split('|').map(x => x.trim()).join('<br>')}</div>`;
  // cena 3
  const lf = await loadImg(C.ASSETS.logoFeira);
  $('s3logo').innerHTML = lf ? `<span class="logoCard"><img src="${C.ASSETS.logoFeira}" style="width:470px;display:block"></span>`
    : `<div style="display:inline-block;width:560px;height:160px;color:#fff">${placeholder('logo-feira.png', 'style="height:100%"')}</div>`;
  $('s3date').innerHTML = `<span class="date">${C.data}</span>`;
  $('s3hora').textContent = C.horario;
  $('s3infos').innerHTML = C.infos.map(w => `<span class="w infos" style="margin:0 12px;font-size:60px;${w === '|' || w === 'e' ? 'opacity:.7' : ''}">${w}</span>`).join('');
  $('s3ctx').innerHTML = C.contexto.map(l => `<div class="ctxl">${l}</div>`).join('');
  // cena 4: grade de parceiros
  const list = (M.parceiros && M.parceiros.length) ? M.parceiros : Array.from({ length: C.ASSETS.parceirosPlaceholder }, () => null);
  const cols = list.length <= 3 ? 1 : list.length <= 4 ? 2 : 3, rows = Math.ceil(list.length / cols);
  const tw = [760, 420, 280][cols - 1], th = [270, 240, 190][cols - 1], gap = 30;
  const gw = cols * tw + (cols - 1) * gap, gh = rows * th + (rows - 1) * gap;
  const gx = (W - gw) / 2, gy = 250 + (H - 250 - 340 - gh) / 2;
  partners = list.map((file, i) => {
    const el = document.createElement('div');
    el.className = 'tile';
    css(el, { width: tw + 'px', height: th + 'px', left: gx + (i % cols) * (tw + gap) + 'px', top: gy + Math.floor(i / cols) * (th + gap) + 'px' });
    el.innerHTML = file ? `<img src="assets/parceiros/${file}">` : placeholder(`parceiros/logo-${i + 1}.png`);
    if (file) tileBg(el, `assets/parceiros/${file}`);
    $('grid').appendChild(el);
    return el;
  });
  // cena 5: ilustrações dos prêmios (placeholder se faltar arquivo)
  // arquivo próprio em assets/ ou, se não houver, a ilustração gerada em assets/ilustracoes/
  const pick = async src => (await loadImg(src)) ? src : (await loadImg(src.replace('assets/', 'assets/ilustracoes/'))) ? src.replace('assets/', 'assets/ilustracoes/') : null;
  const kitSrc = await pick(C.PREMIOS.kit.imagem), malaSrc = await pick(C.PREMIOS.mala.imagem);
  $('kitBox').innerHTML = kitSrc ? `<img src="${kitSrc}">` : placeholder(C.PREMIOS.kit.imagem.split('/').pop());
  $('malaBox').innerHTML = malaSrc ? `<img src="${malaSrc}" style="position:relative">` : placeholder(C.PREMIOS.mala.imagem.split('/').pop());
  $('s5title').innerHTML = C.PREMIOS.titulo.map(l => `<div>${l}</div>`).join('');
  $('kitTxt').innerHTML = C.PREMIOS.kit.texto.map(l => `<div>${l}</div>`).join('');
  $('malaTxt').innerHTML = C.PREMIOS.mala.texto.map(l => `<div>${l}</div>`).join('');
  // cena 6
  $('s6t').innerHTML = C.ctaTitulo.map(l => `<div>${l}</div>`).join('');
  $('s6l').innerHTML = `<div class="ctaL">${C.cta}</div>
    <svg id="arrow" width="70" height="90" viewBox="0 0 70 90" style="margin-top:22px"><path d="M35 6v70M10 52l25 26 25-26" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  $('s6i').textContent = C.ctaInfo;
  const lb = await loadImg(C.ASSETS.logoBeawst);
  $('s6logo').innerHTML = lb ? `<span class="logoCard" style="padding:20px 32px"><img src="${C.ASSETS.logoBeawst}" style="height:120px;display:block"></span>`
    : `<div style="display:inline-block;width:420px;height:150px;color:#fff">${placeholder('logo-beawst.png', 'style="height:100%"')}</div>`;

  // legenda (só com locução); com legenda, o bloco do nome sobe para não colidir
  const cap = $('caption');
  css(cap, { left: '80px', right: '80px', bottom: S.bottom + 'px' });
  window.__nameBottom = M.locucao ? S.bottom + 150 : S.bottom;

  // ajustes de tamanho para caber na largura
  const fitW = W - 2 * S.side;
  document.querySelectorAll('.name,.date,.word').forEach(el => {
    el.closest('.scene').style.display = 'block';
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > fitW && fs > 40) { fs -= 4; el.style.fontSize = fs + 'px'; }
  });
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
}

// ---------- animação ----------
async function render(t) {
  for (let i = 0; i < order.length; i++) {
    const k = order[i], id = 's' + (i + 1);
    $(id).style.display = (t >= T[k] && t < endOf(k)) || (i === order.length - 1 && t >= T[k]) ? 'block' : 'none';
  }
  const inPhoto = t < T.contexto;
  $('bg').style.display = $('shade').style.display = inPhoto ? 'block' : 'none';
  // entrada curta de cada cena (sem transição chamativa)
  for (const [i, k] of order.entries()) if (i > 1) {
    const p = eOut(seg(t, T[k], 0.35));
    $('s' + (i + 1)).style.transform = `scale(${1.04 - 0.04 * p})`;
  }

  // ===== cenas 1 e 2: foto =====
  if (inPhoto && bgMedia) {
    const rev = t - T.revelacao;
    const focus = eOut4(seg(t, T.revelacao, 0.22));                 // foco de câmera, rápido
    const blur = 44 * (1 - focus);
    const bright = 0.42 + 0.58 * focus;
    let scale = 1.18 + 0.07 * seg(t, 0, T.revelacao);               // zoom lento pra dentro
    if (rev >= 0) scale = 1.25 - 0.13 * eOut(seg(t, T.revelacao, 0.7)) + 0.025 * seg(t, T.revelacao + 0.7, T.contexto - T.revelacao);
    css(bgMedia, { filter: `blur(${blur}px) brightness(${bright}) saturate(${0.9 + 0.1 * focus})`, transform: `scale(${scale})` });
    $('shade').style.opacity = eOut(seg(t, T.revelacao + 0.1, 0.5));
    if (bgIsVideo) {
      const vt = Math.max(0, t) % (bgMedia.duration || 1);
      if (Math.abs(bgMedia.currentTime - vt) > 0.01) {
        await new Promise(r => { bgMedia.onseeked = r; bgMedia.currentTime = vt; setTimeout(r, 1000); });
      }
    }
  }

  // cena 1: palavra por palavra, já visível no quadro 0
  if (t < T.revelacao) {
    const ws = $('hookBox').querySelectorAll('.w');
    ws.forEach((w, i) => {
      const p = eOut(seg(t, -0.3 + i * 0.12, 0.3));
      css(w, { opacity: p, transform: `translateY(${(1 - p) * 40}px)` });
    });
    const box = $('hookBox');
    box.style.top = (H / 2 - box.offsetHeight / 2 - 40) + 'px';
    $('hookUl').style.transform = `scaleX(${eOut4(seg(t, 0.95, 0.5))})`;
    box.style.opacity = 1 - seg(t, T.revelacao - 0.12, 0.12);
  }

  // cena 2: nome
  if (t >= T.revelacao && t < T.contexto) {
    const box = $('nameBox');
    box.style.top = (H - window.__nameBottom - box.offsetHeight) + 'px';
    const a = T.revelacao;
    [['nm1', a + 0.18], ['nm2', a + 0.3]].forEach(([id, s]) => {
      const p = eOut4(seg(t, s, 0.55)); css($(id), { opacity: p, transform: `translateY(${(1 - p) * 90}px)` });
    });
    const c = eOut(seg(t, a + 0.7, 0.45)); css($('cargo'), { opacity: c, transform: `translateY(${(1 - c) * 30}px)` });
    $('cred').style.opacity = eOut(seg(t, a + 1.25, 0.6));
  }

  // cena 3: data
  if (t >= T.contexto && t < T.parceiros) {
    const a = T.contexto, L = t - a;
    css($('g31'), { transform: `translate(${-250 + Math.sin(L * .5) * 120}px,${-200 + Math.cos(L * .4) * 100}px)` });
    css($('g32'), { transform: `translate(${500 + Math.cos(L * .45) * 120}px,${1300 + Math.sin(L * .5) * 100}px)` });
    const lg = eOut(seg(t, a + 0.1, 0.5)); css($('s3logo'), { opacity: lg, transform: `translateY(${(1 - lg) * -30}px)` });
    const d = eOut4(seg(t, a + 0.3, 0.6));
    css($('s3date').firstElementChild, { transform: `translateY(${(1 - d) * 105}%) scale(${1 + 0.035 * seg(t, a + 0.9, 6)})` });
    const hp = eOut(seg(t, a + 0.85, 0.45)); css($('s3hora'), { opacity: hp, transform: `translateY(${(1 - hp) * 40}px)` });
    $('s3infos').querySelectorAll('.w').forEach((w, i) => {
      const p = eOut(seg(t, a + 1.2 + i * 0.25, 0.4)); css(w, { opacity: ['|', 'e'].includes(w.textContent) ? p * .7 : p, transform: `translateY(${(1 - p) * 40}px)` });
    });
    $('s3ctx').querySelectorAll('.ctxl').forEach((l, i) => {
      const p = eOut(seg(t, a + 2.4 + i * 0.3, 0.5)); css(l, { opacity: p, transform: `translateY(${(1 - p) * 30}px)` });
    });
  }

  // cena 4: parceiros + frases no ritmo (estudar e trabalhar fora)
  if (t >= T.parceiros && t < T.premio) {
    const a = T.parceiros, beat = 60 / C.BPM;
    css($('g41'), { transform: `translate(${-300 + Math.sin(t * .5) * 100}px,${200 + Math.cos(t * .4) * 80}px)` });
    css($('g42'), { transform: `translate(${560 + Math.cos(t * .45) * 100}px,${1200 + Math.sin(t * .5) * 80}px)` });
    partners.forEach((el, i) => {
      const p = eBack(seg(t, a + 0.1 + i * (3 / C.FPS), 0.35));
      css(el, { opacity: clamp(p), transform: `scale(${0.85 + 0.15 * p})` });
    });
    const wStart = a + 2 * beat;                              // primeira frase na 2ª batida
    const grid = $('grid');
    const dim = seg(t, wStart - 0.15, 0.2);
    css(grid, { opacity: 1 - dim, filter: `blur(${dim * 6}px)` });   // some enquanto as frases estão na tela
    // qual frase está na tela
    const starts = []; let acc = wStart;
    C.frases.forEach(f => { starts.push(acc); acc += f.batidas * beat; });
    let idx = -1; starts.forEach((s0, i) => { if (t >= s0) idx = i; });
    const fStart = starts[idx];
    const wd = $('s4word'), fl = $('s4flag');
    if (idx >= 0) {
      const f = C.frases[idx], last = idx === C.frases.length - 1;
      const per = last ? T.premio - fStart : f.batidas * beat, lt = t - fStart;
      if (wd.dataset.i != idx) { wd.innerHTML = `<div class="phrase">${f.texto}</div>`; wd.dataset.i = idx; }
      const p = eOut4(seg(lt, 0, 0.22)), out = 1 - seg(lt, per - 0.12, 0.12);
      // mídia (bandeiras ou logo do parceiro) entra junto com a frase; fica se a próxima frase usa a mesma
      const prev = C.frases[idx - 1], next = C.frases[idx + 1];
      const key = x => x && x.midia ? JSON.stringify(x.midia) : '';
      const k = key(f), mIn = k && key(prev) !== k, mOut = k && key(next) !== k;
      if (fl.dataset.k !== k) {
        const md = f.midia || {};
        fl.innerHTML = md.bandeiras ? md.bandeiras.map(b => `<span class="flag">${BANDEIRAS[b]}</span>`).join('')
          : md.logo ? `<span class="mlogo" style="background:${md.fundo || '#fff'};border-color:${md.fundo || '#ECE8F0'}"><img src="${md.logo}"></span>` : '';
        fl.dataset.k = k;
      }
      const fp = k ? (mIn ? eBack(seg(lt, 0, 0.4)) : 1) * (mOut ? out : 1) : 0;
      css(fl, { opacity: clamp(fp), transform: `scale(${0.7 + 0.3 * clamp(fp, 0, 1.2)})` });
      const mh = k ? fl.offsetHeight + 50 : 0;
      const top0 = H / 2 - (wd.offsetHeight + mh) / 2 - 40;
      fl.style.top = top0 + 'px';
      wd.style.top = top0 + mh + 'px';
      css(wd, { opacity: p * out, transform: `scale(${1.08 - 0.08 * p})` });
    } else { wd.style.opacity = 0; fl.style.opacity = 0; }
  }

  // cena 5: prêmios (kit de hora em hora → mala pra quem ficar até o fim)
  if (t >= T.premio && t < T.cta) {
    const a = T.premio, L = t - a, m = a + C.PREMIOS.malaEntraEm;
    css($('g51'), { transform: `translate(${-200 + Math.sin(L * .6) * 120}px,${100 + Math.cos(L * .5) * 100}px)` });
    css($('g52'), { transform: `translate(${450 + Math.cos(L * .5) * 120}px,${1150 + Math.sin(L * .6) * 100}px)` });
    // 0) título sozinho na tela, depois sobe para o topo
    const k0 = a + C.PREMIOS.tituloSozinho, tt = $('s5title');
    const ti = eOut4(seg(t, a + 0.1, 0.45)), tu = eOut4(seg(t, k0, 0.5));
    const tH = tt.offsetHeight, yC = H / 2 - tH / 2 - 40, yT = C.SAFE.top + 22;                 // origem no topo: o topo visual fica em yT
    css(tt, { top: (yC + (yT - yC) * tu) + 'px', opacity: ti, transform: `scale(${(0.92 + 0.08 * ti) * (1 - 0.56 * tu)}) translateY(${(1 - ti) * 40}px)`, transformOrigin: '50% 0' });
    // 1) kit entra com scale 0.8 → 1
    const b = seg(t, k0 + 0.25, 0.6);
    const kout = eOut(seg(t, m - 0.15, 0.35));                     // kit sai quando a mala entra
    css($('kitBox'), { opacity: clamp(b * 2) * (1 - kout), transform: `scale(${(0.8 + 0.2 * eBack(b)) * (1 - 0.2 * kout)}) translateY(${Math.sin(L * 2) * 8}px)` });
    $('kitTxt').querySelectorAll('div').forEach((l, i) => {
      const p = eOut4(seg(t, k0 + 0.6 + i * 0.15, 0.5));
      css(l, { opacity: p * (1 - kout), transform: `translateY(${(1 - p) * 50}px)` });
    });
    // 2) mala entra maior, com destaque
    const q = seg(t, m + 0.1, 0.7);
    css($('malaBox'), { opacity: clamp(q * 2.5), transform: `scale(${0.7 + 0.3 * eBack(q)}) translateY(${Math.sin((t - m) * 2) * 8}px)` });
    const g = eOut(seg(t, m + 0.1, 0.8));
    css($('malaGlow'), { opacity: g * (0.75 + 0.25 * Math.sin((t - m) * 3)), transform: `scale(${0.6 + 0.4 * g})` });
    $('malaTxt').querySelectorAll('div').forEach((l, i) => {
      const p = eOut4(seg(t, m + 0.5 + i * 0.15, 0.5)); css(l, { opacity: p, transform: `translateY(${(1 - p) * 50}px)` });
    });
  }

  // cena 6: CTA (anima e segura parado nos últimos 10 quadros)
  if (t >= T.cta) {
    const a = T.cta, L = t - a;
    const stop = C.DURATION - 10 / C.FPS;
    const tl = Math.min(t, stop);
    css($('g61'), { transform: `translate(${-250 + Math.sin(tl * .6) * 120}px,${-150 + Math.cos(tl * .5) * 100}px)` });
    css($('g62'), { transform: `translate(${500 + Math.cos(tl * .5) * 120}px,${1250 + Math.sin(tl * .6) * 100}px)` });
    $('s6t').querySelectorAll('div').forEach((l, i) => {
      const p = eOut4(seg(t, a + 0.08 + i * 0.15, 0.45)); css(l, { opacity: p, transform: `translateY(${(1 - p) * 60}px)` });
    });
    const lp = eOut(seg(t, a + 0.5, 0.4)); css($('s6l'), { opacity: lp, transform: `translateY(${(1 - lp) * 30}px)` });
    const bounce = Math.abs(Math.sin(Math.min(L - 0.7, stop - a - 0.7) * Math.PI * 2 / (60 / C.BPM * 2))) * 18;
    $('arrow').style.transform = `translateY(${L > 0.7 ? bounce : 0}px)`;
    $('s6i').style.opacity = eOut(seg(t, a + 0.75, 0.4));
    $('s6logo').style.opacity = eOut(seg(t, a + 0.9, 0.4));
  }

  // legendas (só com locução)
  const cap = $('caption');
  const lg = M.locucao && C.legendas.find(l => t >= l.start && t < l.end);
  cap.style.display = lg ? 'block' : 'none';
  if (lg) cap.textContent = lg.text;
}
// logo com fundo próprio (ex.: preto): o card assume a cor do canto da imagem
async function tileBg(el, src) {
  const img = await loadImg(src); if (!img) return;
  const c = document.createElement('canvas'); c.width = c.height = 1;
  const x = c.getContext('2d'); x.drawImage(img, 2, 2, 1, 1, 0, 0, 1, 1);
  const [r, g, b, a] = x.getImageData(0, 0, 1, 1).data;
  if (a > 200 && r + g + b < 690) { el.style.background = `rgb(${r},${g},${b})`; el.style.borderColor = `rgb(${r},${g},${b})`; }
  else el.querySelector('img').style.mixBlendMode = 'multiply';   // some com o fundo quase branco do arquivo
}
const BANDEIRAS = {
  irlanda: '<svg viewBox="0 0 3 2"><rect width="1" height="2" fill="#169B62"/><rect x="1" width="1" height="2" fill="#FFFFFF"/><rect x="2" width="1" height="2" fill="#FF883E"/></svg>',
  malta: '<svg viewBox="0 0 30 20"><rect width="15" height="20" fill="#FFFFFF"/><rect x="15" width="15" height="20" fill="#CF142B"/>' +
    '<g transform="translate(2.2 2.2)"><path d="M2 0h2v2h2v2H4v2H2V4H0V2h2z" fill="#B0B0B0" stroke="#CF142B" stroke-width=".35"/></g></svg>',
};
function fitWord(el) {
  let fs = 240; el.style.fontSize = fs + 'px';
  while (el.scrollWidth > W - 2 * S.side && fs > 40) { fs -= 6; el.style.fontSize = fs + 'px'; }
}

window.ready = build().then(() => render(0));
window.render = render;
window.CONFIG = CONFIG;

if (!location.search.includes('render')) {
  window.ready.then(() => {
    const t0 = performance.now();
    (async function loop() { await render(((performance.now() - t0) / 1000) % C.DURATION); requestAnimationFrame(loop); })();
  });
}
