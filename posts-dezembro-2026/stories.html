<title>Stories Dezembro 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap">
<style>
/* SINAIT DS/MG · calendário de novembro 2026, no padrão do carrossel "Voto livre".
   Paleta: preto #200100, laranja #cc4e00, creme #F6F4F2, branco #f5f5f5 nas capas claras; Anton + Montserrat.
   Layout: stories 1080x1920 (área livre embaixo para stickers e barra de resposta), texto centralizado, logo no topo, faixas laranja inclinadas nos destaques. */
:root {
  --preto: #2B2B2B;
  --laranja: #cc4e00;
  --laranja-logo: #f37c28;
  --creme: #F5F5F5;
  --branco: #f5f5f5;
  --creme-70: rgba(246, 244, 242, .74);
  --f-display: "Anton", Impact, "Arial Narrow", sans-serif;
  --f-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
body { background: #0e0000; color: var(--creme); font-family: var(--f-body); padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.post { margin: 0 auto 56px; max-width: 1400px; }
.post h3 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
.post h3 span { color: var(--creme-70); font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 16px; }
.wrap { width: min(100%, 300px); aspect-ratio: 1080 / 1920; position: relative; overflow: hidden; }
.slide { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden;
  background: var(--preto); color: var(--creme); box-sizing: border-box; padding: 0 96px; display: flex; flex-direction: column; align-items: center; text-align: center; }
body.export { padding: 0; background: var(--preto); }
body.export .post h3 { display: none; }
body.export .wrap { width: 1080px; height: 1920px; aspect-ratio: auto; }

/* fundos */
.slide::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.s-escuro::before { background:
  radial-gradient(70% 45% at 85% 105%, rgba(204,78,0,.6) 0%, rgba(204,78,0,.16) 50%, transparent 78%),
  radial-gradient(45% 30% at 0% 0%, rgba(204,78,0,.18) 0%, transparent 70%); }
.s-alt::before { background:
  radial-gradient(70% 45% at 10% 105%, rgba(204,78,0,.55) 0%, rgba(204,78,0,.14) 50%, transparent 78%),
  radial-gradient(45% 30% at 100% 0%, rgba(204,78,0,.18) 0%, transparent 70%); }
.s-creme { background: var(--creme); color: var(--preto); }
.s-branco { background: var(--branco); color: var(--preto); }
.s-branco::before { background: radial-gradient(60% 35% at 100% 100%, rgba(204,78,0,.10) 0%, transparent 70%); }
.s-laranja { background: var(--laranja); }
.s-laranja::before { background: radial-gradient(70% 50% at 100% 0%, rgba(243,124,40,.65) 0%, transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(32,1,0,.35) 0%, transparent 70%); }
.slide > * { position: relative; }
/* capa com foto: foto no alto, escurecendo para baixo; texto na parte escura */
.s-foto { background: var(--preto); }
.s-foto > .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.s-foto::before { z-index: 1; background: linear-gradient(180deg, rgba(32,1,0,.92) 0%, rgba(32,1,0,.45) 14%, rgba(32,1,0,.15) 24%, rgba(32,1,0,.35) 38%, rgba(32,1,0,.9) 58%, var(--preto) 78%); }
.s-foto > :not(.foto) { z-index: 2; }
.s-foto .body { justify-content: flex-end; gap: 36px; padding-bottom: 20px; }
.s-foto .lead { font-size: 40px; }
.s-foto h1 { font-size: 124px !important; }
.s-foto .logo { position: absolute; top: 60px; right: 72px; margin: 0; width: 150px; filter: drop-shadow(0 4px 18px rgba(0,0,0,.6)); }

.logo { width: 170px; margin-top: 70px; flex: none; }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 44px; width: 100%; padding-bottom: 40px; }
.foot { flex: none; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; padding-bottom: 56px; font-size: 22px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; opacity: .75; }
.foot .src { letter-spacing: .02em; text-transform: none; font-weight: 500; font-size: 20px; text-align: left; max-width: 780px; }

.eyebrow { font-size: 26px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--laranja-logo); }
.s-creme .eyebrow, .s-branco .eyebrow { color: var(--laranja); }
.s-laranja .eyebrow { color: var(--preto); }
h1, h2 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; line-height: 1.02; margin: 0; text-wrap: balance; }
h1 { font-size: 150px; }
h2 { font-size: 104px; }
.faixa { display: inline-block; background: var(--laranja); color: var(--creme); padding: .02em .16em .06em; transform: rotate(-3deg); margin-block: .1em .2em; white-space: nowrap; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.faixa.preta { background: var(--preto); }
.lar { color: var(--laranja-logo); }
.s-creme .lar, .s-branco .lar { color: var(--laranja); }
p { margin: 0; }
.lead { font-size: 44px; line-height: 1.32; font-weight: 600; max-width: 860px; text-wrap: balance; }
.txt { font-size: 38px; line-height: 1.4; font-weight: 500; max-width: 860px; text-wrap: balance; }
.txt b, .lead b { font-weight: 800; }
.alerta { font-style: italic; font-weight: 600; font-size: 38px; line-height: 1.38; max-width: 860px; border-top: 4px solid var(--laranja); padding-top: 34px; text-wrap: balance; }
.stat { font-family: var(--f-display); font-size: 330px; line-height: .95; color: var(--laranja); letter-spacing: -.01em; }
.s-escuro .stat, .s-alt .stat { color: var(--laranja-logo); }
.s-laranja .stat { color: var(--creme); }

.ghost { position: absolute !important; left: -40px; right: -40px; bottom: 120px; font-family: var(--f-display); font-size: 300px; line-height: .9; text-transform: uppercase; color: transparent; -webkit-text-stroke: 2px rgba(246,244,242,.07); white-space: nowrap; text-align: center; }
.s-branco .ghost { -webkit-text-stroke: 2px rgba(32,1,0,.06); }

.lista { list-style: none; margin: 0; padding: 0; width: 100%; text-align: left; }
.lista li { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 20px; padding-block: 28px; border-top: 3px solid rgba(246,244,242,.16); font-family: var(--f-display); font-size: 76px; text-transform: uppercase; line-height: 1.05; }
.lista li:last-child { border-bottom: 3px solid rgba(246,244,242,.16); }
.lista .seta { color: var(--laranja-logo); font-size: 64px; line-height: 1; }

.share { display: flex; align-items: center; gap: 18px; font-style: italic; font-weight: 600; font-size: 31px; white-space: nowrap; color: var(--creme-70); }
.share svg { flex: none; }
.s-laranja .share { color: rgba(246,244,242,.88); }

.barras { display: flex; flex-direction: column; gap: 22px; width: 100%; }
.barra { display: grid; grid-template-columns: 170px 1fr 160px; align-items: center; gap: 22px; text-align: left; font-weight: 700; font-size: 30px; letter-spacing: .08em; text-transform: uppercase; }
.barra .trilho { height: 56px; background: rgba(246,244,242,.08); border-radius: 4px; overflow: hidden; }
.barra .valor { display: block; height: 100%; background: var(--creme); border-radius: 4px; }
.barra.destaque .valor { background: var(--laranja); }
.barra .pct { font-family: var(--f-display); font-size: 56px; letter-spacing: 0; text-align: right; }
.barra.destaque .pct { color: var(--laranja-logo); }

/* stories: margens seguras do Instagram (topo ~250px, base ~340px) */
.slide .logo { margin-top: 250px; }
.s-foto .logo { position: absolute; top: 250px; right: 72px; margin: 0; }
.slide .body { padding-bottom: 0; }
.slide .foot { padding-bottom: 360px; }
.slide.sticker .body { flex: none; justify-content: flex-start; padding-top: 110px; }
.slide.sticker .foot { margin-top: auto; }
.s-foto .body { justify-content: flex-end; }
.s-foto.sticker .body { flex: 1; justify-content: flex-end; padding-top: 0; }
.s-foto.sticker .foot { margin-top: 0; }
.pill-feed { display: inline-flex; align-items: center; gap: 14px; background: var(--laranja); color: var(--creme); font-weight: 800; font-size: 30px; letter-spacing: .16em; text-transform: uppercase; padding: 16px 32px; border-radius: 999px; }
.s-laranja .pill-feed { background: var(--preto); }
.dica { font-size: 30px; font-weight: 600; letter-spacing: .04em; opacity: .8; }
.num-grande { font-family: var(--f-display); font-size: 210px; line-height: .95; color: var(--laranja-logo); }
.s-creme .num-grande, .s-branco .num-grande { color: var(--laranja); }
.par { display: flex; flex-direction: column; gap: 8px; align-items: center; }
/* dezembro: foto em faixa no topo (fotos pequenas), desfazendo na cor de fundo */
.s-escuro { --bgc: 43,43,43; } .s-laranja { --bgc: 204,78,0; } .s-branco, .s-creme { --bgc: 245,245,245; } .s-preto { --bgc: 17,17,17; background: #111111; }
.slide > .foto-topo { position: absolute; left: 0; top: 0; width: 100%; height: 1000px; object-fit: cover; }
.slide > .fade-topo { position: absolute; left: 0; top: 0; width: 100%; height: 1001px; background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 26%, rgba(var(--bgc),0) 45%, rgba(var(--bgc),.85) 80%, rgb(var(--bgc)) 100%); }
.com-topo .logo { filter: drop-shadow(0 4px 18px rgba(0,0,0,.6)); }
.com-topo .body { flex: 1; justify-content: flex-end; padding-bottom: 40px; }
.com-topo .foot { margin-top: 0; }
</style>

<div id="posts"></div>

<script>
// Stories que complementam os posts de novembro. Textos tirados dos posts e das legendas do calendário, sem travessão.
// sticker: true deixa a parte de baixo livre para o sticker do Instagram (enquete, quiz, caixinha, post compartilhado).
const feed = (t = 'Post novo no feed') => `<span class="pill-feed">${t} ↓</span>`;
const STORIES = [
  { id: '2026-12-02_stories_minas', nome: '306 anos de Minas Gerais', s: [
    { bg: 'laranja', topo: '02-12-ouro-preto', topoPos: '72% 50%', html: `
      <span class="eyebrow" style="color:var(--creme)">2 de dezembro de 1720</span>
      <h2>Nascia a<br><span class="faixa preta">Capitania de Minas</span></h2>
      <p class="lead">306 anos de uma história escrita <b>por quem trabalha.</b></p>` },
    { bg: 'escuro', foot: ['<span class="src">MTE/SIT, 2025.</span>', ''], html: `
      <span class="eyebrow">Só em 2025, em Minas</span>
      <div class="num-grande" style="font-size:300px">830</div>
      <p class="lead">crianças e adolescentes afastados do trabalho infantil pela Auditoria-Fiscal do Trabalho.</p>` },
    { bg: 'branco', sticker: true, html: `
      ${feed()}
      <h2>Parabéns,<br><span class="faixa">Minas.</span></h2>
      <p class="lead">E que a gente siga cuidando de quem faz <span class="lar">essa terra andar.</span></p>` },
  ]},
  { id: '2026-12-03_stories_pcd', nome: 'Dia Internacional das Pessoas com Deficiência', s: [
    { bg: 'escuro', sticker: true, html: `
      <span class="eyebrow">Quiz</span>
      <h2>A partir de quantos<br>empregados a empresa<br><span class="faixa">precisa cumprir cota?</span></h2>
      <p class="dica">50 · 100 · 500</p>` },
    { bg: 'laranja', foot: ['<span class="src">Lei nº 8.213/1991, art. 93.</span>', ''], html: `
      <h1><span class="faixa preta">100 ou mais.</span></h1>
      <p class="lead">De 2% a 5% das vagas são para pessoas com deficiência ou reabilitadas pelo INSS, conforme o tamanho da empresa.</p>` },
    { bg: 'creme', sticker: true, html: `
      ${feed('Carrossel novo no feed')}
      <h2>A cota é ignorada<br><span class="faixa">na sua empresa?</span></h2>
      <p class="lead">Denuncie pelo <b>Sistema Ipê (MTE)</b>.</p>` },
  ]},
  { id: '2026-12-09_stories_fim-de-ano', nome: 'Trabalho de fim de ano', s: [
    { bg: 'escuro', sticker: true, html: `
      <span class="eyebrow">Quiz</span>
      <h2>Contrato temporário<br>tem direito<br><span class="faixa">a férias?</span></h2>
      <p class="dica">Tem · Não tem</p>` },
    { bg: 'creme', foot: ['<span class="src">Lei nº 6.019/1974, art. 12.</span>', ''], html: `
      <h1><span class="faixa">Tem.</span></h1>
      <p class="lead">Férias proporcionais, repouso semanal remunerado, adicional noturno, <span class="lar">FGTS e proteção previdenciária.</span></p>
      <p class="txt" style="font-weight:600">E no fim do contrato, indenização de 1/12 do que você recebeu.</p>` },
    { bg: 'laranja', sticker: true, html: `
      ${feed('Carrossel novo no feed')}
      <h2>Sem carteira assinada,<br><span class="faixa preta">não é bico.</span></h2>
      <p class="lead">Trabalhou sem registro? Denuncie no <b>Sistema Ipê (MTE)</b> ou procure o <b>sindicato</b>.</p>` },
  ]},
  { id: '2026-12-10_stories_direitos-humanos', nome: 'Dia Internacional dos Direitos Humanos', s: [
    { bg: 'branco', html: `
      <span class="eyebrow">10 de dezembro de 1948</span>
      <h2>A ONU proclamou a<br><span class="faixa">Declaração Universal</span><br>dos Direitos Humanos</h2>` },
    { bg: 'escuro', sticker: true, html: `
      <span class="eyebrow">Enquete</span>
      <h2>Você sabia que ela<br>fala de<br><span class="faixa">férias remuneradas?</span></h2>` },
    { bg: 'laranja', sticker: true, foot: ['<span class="src">ONU, Declaração Universal dos Direitos Humanos (1948), arts. 23 e 24.</span>', ''], html: `
      ${feed('Carrossel novo no feed')}
      <h2>Direito humano também é<br><span class="faixa preta">direito trabalhista</span></h2>
      <p class="lead">Condições justas, igual remuneração por igual trabalho, repouso, limitação das horas e férias remuneradas.</p>` },
  ]},
  { id: '2026-12-25_stories_natal', nome: 'Natal', s: [
    { bg: 'escuro', topo: '25-12-natal', topoPos: '78% 50%', html: `
      <h1>Feliz<br><span class="faixa">Natal</span></h1>
      <p class="lead">Que o dia seja de descanso para quem pode e de <span class="lar">reconhecimento para quem trabalha hoje.</span></p>` },
    { bg: 'laranja', html: `
      <h2>Natal é pausa<br>pra muita gente.</h2>
      <p class="lead">E também é dia de trabalho pra quem <b>cuida, entrega, atende e socorre.</b></p>` },
    { bg: 'escuro', sticker: true, html: `
      <span class="eyebrow">Caixinha</span>
      <h2>Manda um recado<br>pra quem está<br><span class="faixa">trabalhando hoje</span></h2>
      <p class="lead">Boas festas de toda a equipe do SINAIT DS/MG.</p>` },
  ]},
  { id: '2026-12-31_stories_ano-novo', nome: 'Ano Novo', s: [
    { bg: 'preto', topo: '31-12-ano-novo', topoPos: '50% 40%', html: `
      <div class="num-grande" style="font-size:340px">2027</div>
      <h2><span class="faixa">chegando</span></h2>` },
    { bg: 'laranja', html: `
      <h2>A missão<br><span class="faixa preta">continua a mesma</span></h2>
      <p class="lead">Trabalho digno para quem trabalha. Mais direitos respeitados, mais empregos com carteira assinada.</p>` },
    { bg: 'escuro', sticker: true, html: `
      <span class="eyebrow">Caixinha</span>
      <h2>O que você quer ver<br>aqui em<br><span class="faixa">2027?</span></h2>
      <p class="lead">Obrigado por estar com a gente em 2026.</p>` },
  ]},
];

function storyHTML(st, s, i) {
  const claro = /branco|creme/.test(s.bg) && !s.topo;
  const cls = s.bg.split(' ').map(b => 's-' + b).join(' ') + (s.sticker ? ' sticker' : '') + (s.topo ? ' com-topo' : '');
  const foot = s.foot || ['', ''];
  return `<div class="wrap"><section class="slide ${cls}" data-out="${st.id}/${st.id}_${String(i + 1).padStart(2, '0')}.png">
    ${s.foto ? `<img class="foto" src="fotos/${s.foto}.jpg" alt="" style="${s.fotoStyle || ''}">` : ''}
    ${s.topo ? `<img class="foto-topo" src="fotos/${s.topo}.jpg" alt="" style="object-position:${s.topoPos || '50% 50%'}"><div class="fade-topo"></div>` : ''}
    <img class="logo" src="${claro ? 'logo-sinait-dsmg-escuro.png' : 'logo-sinait-dsmg.png'}" alt="SINAIT DS/MG">
    <div class="body">${s.html}</div>
    <div class="foot"><span>${foot[0]}</span><span>${foot[1]}</span></div>
  </section></div>`;
}
document.getElementById('posts').innerHTML = STORIES.map(st => `<section class="post"><h3>${st.id} <span>Stories · ${st.nome}</span></h3><div class="row">${st.s.map((s, i) => storyHTML(st, s, i)).join('')}</div></section>`).join('');

const exp = new URLSearchParams(location.search).has('export');
if (exp) document.body.classList.add('export');
const fit = () => document.querySelectorAll('.wrap').forEach(w => { w.querySelector('.slide').style.transform = exp ? 'none' : `scale(${w.clientWidth / 1080})`; });
addEventListener('resize', fit); fit();
</script>
