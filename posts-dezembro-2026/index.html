:root {
  --gelo: #F5F5F5;

body { background: #0b0b0b; color: var(--gelo); font-family: var(--f-body); padding-block: 24px;

.post { margin: 0 auto 56px; max-width: 1500px; }
.post h3 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
.post h3 span { color: var(--gelo-70); font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 16px; }
.wrap { width: min(100%, 280px); aspect-ratio: 1080 / 1350; position: relative; overflow: hidden; }
.slide { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 0 0; overflow: hidden; box-sizing: border-box;
  padding: 80px; display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--gelo); }
body.export { padding: 0; background: var(--preto); }
body.export .post h3 { display: none; }
body.export .wrap { width: 1080px; height: 1350px; aspect-ratio: auto; }

/* fundos */
.slide::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
.s-branco { background: var(--gelo); color: var(--chumbo); }
.s-branco::before { background: radial-gradient(60% 35% at 100% 100%, rgba(204,78,0,.09) 0%, transparent 70%); }
.s-laranja { background: var(--laranja); }
.s-laranja::before { background: radial-gradient(70% 50% at 100% 0%, rgba(243,124,40,.55) 0%, transparent 70%), radial-gradient(60% 40% at 0% 100%, rgba(0,0,0,.22) 0%, transparent 70%); }
.s-chumbo { background: var(--chumbo); }
.s-chumbo::before { background: radial-gradient(70% 45% at 90% 105%, rgba(204,78,0,.35) 0%, transparent 72%); }
.s-preto { background: var(--preto); }

.com-foto .body { justify-content: flex-end; gap: 34px; }
.com-foto .body { padding-bottom: 36px; }
.s-branco > .fade { background: linear-gradient(180deg, rgba(245,245,245,.75) 0%, rgba(245,245,245,0) 22%, rgba(245,245,245,0) 42%, rgba(245,245,245,.85) 78%, rgb(245,245,245) 100%); }

.logo { position: absolute; top: 80px; right: 80px; width: 160px; }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 42px; width: 100%; padding-top: 110px; }

function slideHTML(post, s, i, n) {
  const claro = s.bg === 'branco';
  const pasta = post.pasta || post.id;
  const out = n > 1 ? `${pasta}/${post.id}_${String(i + 1).padStart(2, '0')}.png` : `${pasta}/${post.id}.png`;
  return `<div class="wrap"><section class="slide s-${s.bg}${s.foto ? ' com-foto' : ''}" data-out="${out}">
    ${s.foto ? `<img class="foto" src="fotos/${s.foto}.jpg" alt="" style="object-position:${s.fotoPos || '50% 50%'}"><div class="fade"></div>` : ''}
    ${s.ghost && !s.foto ? `<div class="ghost">${s.ghost}</div>` : ''}
    <img class="logo" src="${claro ? 'logo-sinait-dsmg-escuro.png' : 'logo-sinait-dsmg.png'}" alt="SINAIT DS/MG">
    <div class="body">${s.html}</div>
    <div class="foot"><span>${s.foot[0]}</span><span>${s.foot[1]}</span></div>
  </section></div>`;
}
document.getElementById('posts').innerHTML = POSTS.map(p => `<section class="post"><h3>${p.data} <span>${p.nome}</span></h3><div class="row">${p.slides.map((s, i) => slideHTML(p, s, i, p.slides.length)).join('')}</div></section>`).join('');

const exp = new URLSearchParams(location.search).has('export');
if (exp) document.body.classList.add('export');
const fit = () => document.querySelectorAll('.wrap').forEach(w => { w.querySelector('.slide').style.transform = exp ? 'none' : `scale(${w.clientWidth / 1080})`; });
addEventListener('resize', fit); fit();
</script>
