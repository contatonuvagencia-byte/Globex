# Publicação gratuita no Netlify (o plano grátis permite uso comercial).
# O painel fica na pasta painel-nuv. Estas configurações valem mais que as da tela do Netlify.
[build]
  base = "painel-nuv"
  command = "npm run build"
  publish = ".next"
  # Cada publicação gasta créditos do plano grátis (cerca de 20 por mês).
  # Só publica quando a mensagem do commit tiver [deploy]; os outros envios são ignorados.
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "20"

# Faz o Netlify rodar o painel como app Next.js (login, páginas e rotas de API).
# Sem isso ele publica só arquivos soltos e mostra "Página não encontrada".
[[plugins]]
  package = "@netlify/plugin-nextjs"
