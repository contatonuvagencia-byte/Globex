<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Beawst Reels Palestra</title>
<script>
/* =====================================================================
   CONFIGURAÇÃO — edite textos, cores e tempos aqui.
   Textos aceitam HTML simples: <span class="lav">…</span> (lavanda)
   e <span class="lima">…</span> (verde-lima). <br> quebra linha.
   ===================================================================== */
const CONFIG = {
  WIDTH: 1080, HEIGHT: 1920, FPS: 30,
  DURATION: 21.5,               // segundos (cena 6 segura parada no final)

  COLORS: {
    bg: '#0A0F2C',
    text: '#FFFFFF',
    support: 'rgba(255,255,255,0.72)',
    lavanda: '#A78BFF',
    lima: '#D6FF5C',
    lights: ['#6B3BFF', '#2E5BFF', '#8F5BFF'],   // manchas de luz do fundo
    progressTrack: 'rgba(255,255,255,0.12)',
  },

  // Área segura do Reels (nenhum texto fora dela)
  SAFE: { top: 250, bottom: 400, right: 140, left: 96 },

  ANIM: {
    inDuration: 0.5,     // entrada de cada linha (sobe + fade, ease-out)
    rise: 36,            // px que a linha sobe ao entrar
    cardSlide: 140,      // px que os cards deslizam vindos da esquerda
    firstDelay: 0.15,    // atraso do primeiro elemento após o início da cena
    stagger: 0.2,        // intervalo padrão entre elementos (0,15 a 0,3)
    outDuration: 0.3,    // fade de saída da cena
    progressHeight: 6,
  },

  // Foto da Camila (cena 3). null = sem foto. Ex.: 'assets/camila.jpg'
  PHOTO_CAMILA: null,

  SCENES: [
    { id: 'gancho', start: 0, end: 3.4, stagger: 0.28, items: [
      { type: 'kicker', text: 'INTERCÂMBIO É' },
      { type: 'huge', text: 'VIAGEM', color: 'text' },
      { type: 'kicker', text: 'OU É', gapTop: 28 },
      { type: 'huge', text: 'CARREIRA?', color: 'lima' },
    ]},
    { id: 'evento', start: 3.4, end: 6.8, items: [
      { type: 'badge', text: 'FEIRA ONLINE E GRATUITA' },
      { type: 'title', text: 'Beawst Global<br><span class="lav">Connect</span>' },
      { type: 'year', text: '2026' },
      { type: 'badgeOutline', text: '07.11 · 08h às 13h' },
    ]},
    { id: 'palestra', start: 6.8, end: 10.9, items: [
      { type: 'kicker', text: 'PALESTRA PRINCIPAL', color: 'lima' },
      { type: 'title', text: 'Camila Fidélis' },
      { type: 'meta', text: 'Executiva de RH · 20 anos de mercado' },
      { type: 'body', text: 'Como o intercâmbio acelera a sua carreira global.' },
    ]},
    { id: 'feira', start: 10.9, end: 15, items: [
      { type: 'kicker', text: 'E TEM MAIS' },
      { type: 'subtitle', text: 'Na feira você vai' },
      { type: 'card', num: '01', title: 'Escolas internacionais ao vivo' },
      { type: 'card', num: '02', title: 'Gateway School, de Malta' },
      { type: 'card', num: '03', title: 'Dúvidas de visto e passaporte', sub: 'com o Mundo dos Vistos' },
    ]},
    { id: 'brindes', start: 15, end: 17.4, items: [
      { type: 'kicker', text: 'E AINDA' },
      { type: 'huge', text: 'BRINDES', color: 'lima' },
      { type: 'huge', text: 'AO VIVO', color: 'text' },
      { type: 'body', text: 'e condições exclusivas durante a transmissão.' },
    ]},
    { id: 'cta', start: 17.4, end: 21.5, stagger: 0.15, items: [
      { type: 'date', text: '07.11' },
      { type: 'lead', text: '08h às 13h', color: 'lavanda' },
      { type: 'meta', text: '100% online e gratuito' },
      { type: 'button', text: 'GARANTA SUA VAGA' },
      { type: 'meta', text: 'Link na bio', gapTop: 8 },
    ]},
  ],

  // Pulso sutil do botão (cena 6). Depois disso a cena fica parada.
  BUTTON_PULSE: { start: 18.75, duration: 0.7, scale: 0.035 },
};
</script>
<style>
@font-face{font-family:M;font-weight:500;src:url(assets/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(assets/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(assets/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(assets/montserrat-latin-900-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:var(--bg)}
body{font-family:M,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:var(--bg)}
.light{position:absolute;border-radius:50%;filter:blur(140px)}
#progress{position:absolute;left:0;top:0;width:100%;background:var(--track);z-index:10}
#progress i{position:absolute;left:0;top:0;bottom:0;background:var(--lima);transform-origin:left}
.scene{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.item{will-change:transform,opacity}
.lav{color:var(--lavanda)} .lima{color:var(--lima)}
.kicker{font-weight:800;font-size:34px;letter-spacing:.16em;margin-bottom:14px}
.huge{font-weight:900;font-size:230px;line-height:.92;letter-spacing:-.02em;white-space:nowrap}
.title{font-weight:900;font-size:112px;line-height:.98;letter-spacing:-.02em;margin-bottom:18px}
.subtitle{font-weight:800;font-size:64px;line-height:1.05;margin-bottom:36px;letter-spacing:-.01em}
.year{font-weight:900;font-size:112px;line-height:1;color:var(--support);letter-spacing:-.01em;margin-bottom:40px}
.meta{font-weight:500;font-size:36px;line-height:1.35;color:var(--support);margin-bottom:22px}
.body{font-weight:500;font-size:44px;line-height:1.3;max-width:100%;margin-top:10px}
.lead{font-weight:800;font-size:72px;line-height:1.05;margin-bottom:14px}
.date{font-weight:900;font-size:330px;line-height:.9;letter-spacing:-.04em;white-space:nowrap;margin-bottom:20px}
.badge{font-weight:800;font-size:26px;letter-spacing:.14em;padding:16px 26px;border-radius:999px;background:rgba(167,139,255,.16);color:var(--lavanda);margin-bottom:40px}
.badgeOutline{font-weight:700;font-size:36px;padding:18px 34px;border-radius:999px;border:2px solid rgba(255,255,255,.55)}
.card{width:100%;display:flex;align-items:flex-start;gap:30px;padding:36px 38px;margin-bottom:20px;border-radius:28px;
  background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.16);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.card .n{font-weight:800;font-size:36px;color:var(--lavanda);line-height:1.15;letter-spacing:.02em}
.card .t{font-weight:800;font-size:40px;line-height:1.15}
.card .s{font-weight:500;font-size:32px;line-height:1.3;color:var(--support);margin-top:8px}
.button{margin-top:38px;margin-bottom:26px;padding:38px 60px;border-radius:22px;background:var(--lima);color:var(--bg);
  font-weight:900;font-size:56px;letter-spacing:.02em;white-space:nowrap;transform-origin:left center}
.photo{position:absolute;overflow:hidden;border-radius:44px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<div id="stage"><div id="progress"><i></i></div></div>
<script>
const C = CONFIG, A = C.ANIM, S = C.SAFE;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, d) => clamp((t - a) / d);
const easeOut = x => 1 - Math.pow(1 - x, 3);

const root = document.documentElement.style;
root.setProperty('--bg', C.COLORS.bg);
root.setProperty('--text', C.COLORS.text);
root.setProperty('--support', C.COLORS.support);
root.setProperty('--lavanda', C.COLORS.lavanda);
root.setProperty('--lima', C.COLORS.lima);
root.setProperty('--track', C.COLORS.progressTrack);

const stage = document.getElementById('stage');
stage.style.width = C.WIDTH + 'px'; stage.style.height = C.HEIGHT + 'px';
document.body.style.width = C.WIDTH + 'px'; document.body.style.height = C.HEIGHT + 'px';
const bar = document.getElementById('progress');
bar.style.height = A.progressHeight + 'px';
const barFill = bar.firstElementChild;

// manchas de luz (movimento lento)
const lights = C.COLORS.lights.map((color, i) => {
  const el = document.createElement('div');
  el.className = 'light';
  const size = [900, 820, 700][i % 3];
  Object.assign(el.style, { width: size + 'px', height: size + 'px', background: color, opacity: [.42, .42, .28][i % 3] });
  stage.insertBefore(el, bar);
  return { el, size, base: [[-260, 120], [520, 1050], [380, 300]][i % 3], phase: i * 2.1 };
});

const SAFE_W = C.WIDTH - S.left - S.right;
const colorOf = k => k ? (C.COLORS[k] || k) : null;

// monta as cenas a partir do CONFIG
const built = C.SCENES.map(sc => {
  const el = document.createElement('div');
  el.className = 'scene';
  Object.assign(el.style, { left: S.left + 'px', top: S.top + 'px', width: SAFE_W + 'px', height: C.HEIGHT - S.top - S.bottom + 'px' });
  const items = sc.items.map(it => {
    const d = document.createElement('div');
    d.className = 'item ' + it.type;
    if (it.type === 'card') {
      d.innerHTML = `<div class="n">${it.num}</div><div><div class="t">${it.title}</div>${it.sub ? `<div class="s">${it.sub}</div>` : ''}</div>`;
    } else d.innerHTML = it.text;
    if (it.color) d.style.color = colorOf(it.color);
    if (it.gapTop) d.style.marginTop = it.gapTop + 'px';
    el.appendChild(d);
    return { el: d, type: it.type };
  });
  stage.insertBefore(el, bar);
  let photo = null;
  if (sc.id === 'palestra' && C.PHOTO_CAMILA) {
    photo = document.createElement('div');
    photo.className = 'photo';
    Object.assign(photo.style, { width: '470px', height: '600px', right: '60px', top: S.top + 20 + 'px' });
    photo.innerHTML = `<img src="${C.PHOTO_CAMILA}">`;
    stage.insertBefore(photo, bar);
    el.style.justifyContent = 'flex-end';   // texto abaixo da foto
  }
  return { ...sc, el, items, photo };
});

// títulos gigantes: reduz a fonte até caber na largura segura
function fit() {
  for (const sc of built) {
    sc.el.style.display = 'flex';
    for (const it of sc.items) {
      if (!['huge', 'date', 'title', 'button'].includes(it.type)) continue;
      let fs = parseFloat(getComputedStyle(it.el).fontSize);
      it.el.style.maxWidth = 'none';
      while (it.el.scrollWidth > SAFE_W && fs > 20) { fs -= 2; it.el.style.fontSize = fs + 'px'; }
    }
  }
}

function render(t) {
  barFill.style.width = '100%';
  barFill.style.transform = `scaleX(${clamp(t / C.DURATION)})`;

  for (const L of lights) {
    const x = L.base[0] + Math.sin(t * 0.22 + L.phase) * 160;
    const y = L.base[1] + Math.cos(t * 0.17 + L.phase) * 140;
    L.el.style.transform = `translate(${x}px,${y}px)`;
  }

  built.forEach((sc, si) => {
    const last = si === built.length - 1;
    const on = t >= sc.start && (last || t < sc.end);
    sc.el.style.display = on ? 'flex' : 'none';
    if (sc.photo) sc.photo.style.display = on ? 'block' : 'none';
    if (!on) return;
    const out = last ? 1 : 1 - seg(t, sc.end - A.outDuration, A.outDuration);
    sc.el.style.opacity = out;
    const stagger = sc.stagger ?? A.stagger;
    sc.items.forEach((it, i) => {
      const p = easeOut(seg(t, sc.start + A.firstDelay + i * stagger, A.inDuration));
      const move = it.type === 'card'
        ? `translateX(${(1 - p) * -A.cardSlide}px)`
        : `translateY(${(1 - p) * A.rise}px)`;
      let scale = '';
      if (it.type === 'button') {
        const q = seg(t, C.BUTTON_PULSE.start, C.BUTTON_PULSE.duration);
        scale = ` scale(${1 + Math.sin(q * Math.PI) * C.BUTTON_PULSE.scale})`;
      }
      it.el.style.transform = move + scale;
      it.el.style.opacity = p;
    });
    if (sc.photo) {
      const p = easeOut(seg(t, sc.start + A.firstDelay + 0.1, A.inDuration + 0.2));
      const zoom = 1 + ((t - sc.start) / (sc.end - sc.start)) * 0.06;
      sc.photo.style.opacity = p * out;
      sc.photo.style.transform = `translateX(${(1 - p) * 60}px)`;
      sc.photo.firstElementChild.style.transform = `scale(${zoom})`;
    }
  });
}

window.ready = (async () => {
  await Promise.all([500, 700, 800, 900].map(w => document.fonts.load(`${w} 100px M`, 'ÁÇãé')));
  fit();
  render(0);
})();
window.render = render;
window.CONFIG = CONFIG;

// pré-visualização em tempo real ao abrir no navegador
if (!location.search.includes('render')) {
  window.ready.then(() => {
    const t0 = performance.now();
    (function loop() { render(((performance.now() - t0) / 1000) % C.DURATION); requestAnimationFrame(loop); })();
  });
}
</script>
</body>
</html>
